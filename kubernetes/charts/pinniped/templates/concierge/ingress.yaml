{{- if and .Values.concierge.enabled .Values.concierge.ingress.enabled (eq .Values.concierge.ingress.provider "traefik") }}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ printf "%s-ingress-tcp" (include "pinniped.componentName" (dict "root" . "component" "concierge")) | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "pinniped.componentNamespace" (dict "root" . "component" "concierge") }}
  labels:
{{ include "pinniped.componentLabels" (dict "root" . "component" "concierge" "componentValues" .Values.concierge) | indent 4 }}
{{- with .Values.concierge.ingress.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
{{- end }}
spec:
{{- with .Values.concierge.ingress.traefik.entryPoints }}
  entryPoints:
{{ toYaml . | indent 4 }}
{{- end }}
  routes:
    - match: {{ default (printf "HostSNI(`%s`)" (required "concierge.ingress.hostname is required when ingress is enabled" .Values.concierge.ingress.hostname )) .Values.concierge.ingress.traefik.match | quote }}
      services:
        - name: {{ include "pinniped.concierge.ingressServiceName" . }}
          port: {{ default .Values.concierge.service.proxy.port .Values.concierge.ingress.service.port }}
  tls:
{{- if .Values.concierge.ingress.traefik.tlsPassthrough }}
    passthrough: true
{{- end }}
{{- if .Values.concierge.ingress.traefik.tlsSecretName }}
    secretName: {{ .Values.concierge.ingress.traefik.tlsSecretName | quote }}
{{- end }}
{{- end }}
{{- if and .Values.concierge.enabled .Values.concierge.ingress.enabled (eq .Values.concierge.ingress.provider "nginx") }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ printf "%s-ingress" (include "pinniped.componentName" (dict "root" . "component" "concierge")) | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "pinniped.componentNamespace" (dict "root" . "component" "concierge") }}
  labels:
{{ include "pinniped.componentLabels" (dict "root" . "component" "concierge" "componentValues" .Values.concierge) | indent 4 }}
  annotations:
{{- with .Values.concierge.ingress.annotations }}
{{ toYaml . | indent 4 }}
{{- end }}
    nginx.ingress.kubernetes.io/ssl-passthrough: {{ .Values.concierge.ingress.nginx.sslPassthrough | quote }}
    nginx.ingress.kubernetes.io/backend-protocol: {{ .Values.concierge.ingress.nginx.backendProtocol | quote }}
spec:
  ingressClassName: "nginx"
  rules:
    - host: {{ required "concierge.ingress.hostname is required when nginx passthrough ingress is enabled" .Values.concierge.ingress.hostname | quote }}
      http:
        paths:
          - path: {{ .Values.concierge.ingress.nginx.path | quote }}
            pathType: {{ .Values.concierge.ingress.nginx.pathType }}
            backend:
              service:
                name: {{ include "pinniped.concierge.ingressServiceName" . }}
                port:
                  number: {{ default .Values.concierge.service.proxy.port .Values.concierge.ingress.service.port }}
  {{- if .Values.concierge.ingress.nginx.tlsSecretName }}
  tls:
    - hosts:
        - {{ required "concierge.ingress.hostname is required when nginx passthrough ingress is enabled" .Values.concierge.ingress.hostname | quote }}
      secretName: {{ .Values.concierge.ingress.nginx.tlsSecretName | quote }}
  {{- end }}
  {{- end }}
