{{- if .Values.supervisor.enabled }}
{{- $selector := dict "root" . "component" "supervisor" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pinniped.componentName" (dict "root" . "component" "supervisor") }}
  namespace: {{ include "pinniped.componentNamespace" (dict "root" . "component" "supervisor") }}
  labels:
{{ include "pinniped.componentLabels" (dict "root" . "component" "supervisor" "componentValues" .Values.supervisor) | indent 4 }}
spec:
  replicas: {{ .Values.supervisor.replicaCount }}
  selector:
    matchLabels:
{{ include "pinniped.componentSelectorLabels" $selector | indent 6 }}
  template:
    metadata:
      labels:
{{ include "pinniped.componentSelectorLabels" $selector | indent 8 }}
    spec:
      securityContext:
{{ toYaml .Values.supervisor.podSecurityContext | indent 8 }}
      serviceAccountName: {{ include "pinniped.supervisor.serviceAccountName" (dict "root" .) }}
{{- if .Values.supervisor.imagePullSecret.create }}
      imagePullSecrets:
        - name: {{ .Values.supervisor.imagePullSecret.name }}
{{- end }}
      containers:
        - name: {{ include "pinniped.componentName" (dict "root" . "component" "supervisor") }}
          image: {{ include "pinniped.image" (dict "root" . "image" .Values.supervisor.image) }}
          imagePullPolicy: {{ .Values.supervisor.image.pullPolicy }}
          command:
            - pinniped-supervisor
            - /etc/podinfo
            - /etc/config/pinniped.yaml
          securityContext:
{{ toYaml .Values.supervisor.containerSecurityContext | indent 12 }}
          resources:
{{ toYaml .Values.supervisor.resources | indent 12 }}
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
              readOnly: true
            - name: podinfo
              mountPath: /etc/podinfo
              readOnly: true
          ports:
            - containerPort: 8443
              protocol: TCP
          env:
{{- if .Values.supervisor.config.httpsProxy }}
            - name: HTTPS_PROXY
              value: {{ .Values.supervisor.config.httpsProxy | quote }}
            - name: NO_PROXY
              value: {{ .Values.supervisor.config.noProxy | quote }}
{{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 2
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 2
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: config-volume
          configMap:
            name: {{ printf "%s-static-config" (include "pinniped.componentName" (dict "root" . "component" "supervisor")) | trunc 63 | trimSuffix "-" }}
        - name: podinfo
          downwardAPI:
            items:
              - path: labels
                fieldRef:
                  fieldPath: metadata.labels
              - path: namespace
                fieldRef:
                  fieldPath: metadata.namespace
              - path: name
                fieldRef:
                  fieldPath: metadata.name
      tolerations:
        - key: kubernetes.io/arch
          effect: NoSchedule
          operator: Equal
          value: amd64
        - key: kubernetes.io/arch
          effect: NoSchedule
          operator: Equal
          value: arm64
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
{{ include "pinniped.componentSelectorLabels" $selector | indent 20 }}
                topologyKey: kubernetes.io/hostname
{{- end }}
