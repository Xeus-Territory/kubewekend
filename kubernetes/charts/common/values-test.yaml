enabled: true
replicaCount: 1
deploymentAnnotations:
  # Restart pods when todo-app-config / todo-app-secret (referenced in env / envFrom) change
  reloader.stakater.com/auto: "true"
  kubewekend.io/owner: "{{ .Release.Name }}"
revisionHistoryLimit: 5
minReadySeconds: 5
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
# schedulerName: my-scheduler
# priorityClassName: high-priority # must exist in the cluster
# runtimeClassName: nvidia # GPU workloads via device plugin; must exist in the cluster
terminationGracePeriodSeconds: 30
lifecycle:
  preStop:
    sleep:
      seconds: 5
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
podAntiAffinityPreset:
  type: soft
  topologyKey: kubernetes.io/hostname
  weight: 50
fullnameOverride: "kubewekend-todo-application"
image:
  repository: "xeusnguyen/application"
  pullPolicy: IfNotPresent
  tag: "v0.0.1"
imagePullSecrets: []
command: ["/bin/sh", "-c"]
runtimeArgs: ["yarn run dev"]
env:
  app_mode: development
  db_password: "secret:todo-app-secret:password"
  app_config: "configmap:todo-app-config:app-config.yaml"
  pod_name: "field:metadata.name"
  pod_namespace: "field:metadata.namespace"
  cpu_limit: "resource:limits.cpu"
  memory_limit_mib: "resource:limits.memory:1Mi"
envFrom:
  - configMapRef:
      name: todo-app-config
      optional: true
  - secretRef:
      name: todo-app-secret
      optional: true
containerPorts:
  - name: http
    containerPort: 3000
    protocol: TCP
  - name: metrics
    containerPort: 9090
    protocol: TCP
service:
  enabled: true
  port: 3000
  targetPort: http
  primaryPortName: web
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
    - name: web
      port: 3000
      targetPort: http
      protocol: TCP
  headless: false
volumeMounts:
  - name: logs
    mountPath: /var/log/app
volumes:
  - name: logs
    emptyDir: {}
persistence:
  enabled: true
  existingClaim: "{{ .Release.Name }}-uploads" # e.g. a Longhorn / NFS RWX claim
  accessMode: ReadWriteMany
  mountPath: /app/uploads
initContainers:
  - name: migrate
    image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
    command: ["/bin/sh", "-c", "yarn run migrate"]
    envFrom:
      - secretRef:
          name: todo-app-secret
          optional: true
  - name: log-shipper # native sidecar (Kubernetes >= 1.29)
    image: fluent/fluent-bit:3.2
    restartPolicy: Always
    volumeMounts:
      - name: logs
        mountPath: /var/log/app
        readOnly: true
extraContainers:
  - name: busybox-sidecar
    image: busybox:1.37
    command: ["/bin/sh", "-c", "tail -F /var/log/app/app.log"]
    volumeMounts:
      - name: logs
        mountPath: /var/log/app
        readOnly: true
serviceAccount:
  create: true
  name: kubewekend-sc
resources:
  limits:
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi
rbac:
  create: true
  role:
    create: true
    kind: Role
    rules:
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["get", "list", "watch"]
      - apiGroups: [""]
        resources: ["configmaps"]
        verbs: ["get"]
  roleBinding:
    create: true
    kind: RoleBinding
    subjects:
      - kind: ServiceAccount
        name: kubewekend-sc
        namespace: default
# Pre-existing role example:
# rbac:
#   create: false
#   role:
#     create: false
#     kind: ClusterRole
#   roleBinding:
#     create: true
#     roleRef:
#       apiGroup: rbac.authorization.k8s.io
#       kind: ClusterRole
#       name: view
#     subjects:
#       - kind: ServiceAccount
#         name: kubewekend-sc
#         namespace: default
# Cluster-scoped example:
# rbac:
#   create: true
#   role:
#     kind: ClusterRole
#     rules:
#       - apiGroups: [""]
#         resources: ["nodes"]
#         verbs: ["get", "list", "watch"]
#   roleBinding:
#     # kind defaults to ClusterRoleBinding when role.kind is ClusterRole
#     subjects:
#       - kind: ServiceAccount
#         name: kubewekend-sc
#         namespace: default
probes:
  path: /
  port: http
  # disableProbes: ["all"]
  livenessProbe:
    httpGet:
      path: /healthz
  readinessProbe:
    httpGet:
      port: 8000
ingress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  hosts:
    - host: "todo.local"
      paths:
        - path: /
          pathType: Prefix
httpRoute:
  enabled: true
  parentRefs:
    - name: traefik-gateway
      sectionName: web
  hostnames:
    - "todo.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack # matches kube-prometheus-stack's default serviceMonitorSelector
  port: metrics # Service port "metrics" -> container port 9090
  path: /metrics
  interval: 30s
podMonitor:
  enabled: false # enable instead of serviceMonitor to scrape the pods directly
  port: metrics # container port name
testConnection: false
pdb:
  create: true
  minAvailable: 1
  maxUnavailable: 0
podAnnotations:
  test-annotation: "true"
vault:
  enabled: false
  # These value are only required when `template.type = annotation`
  config:
    path: "secret/data/project" # vault secret path
    role: "vault-role"        # vault k8s auth role
    serviceServer: "https://vault.svc.cluster.local:8200" # vault server address
    namespace: "default" # vault namespace
    # Auth method to use for Vault Agent sidecar
    # Options: kubernetes | token | etc (see https://developer.hashicorp.com/vault/docs/auth)
    authPath: "auth/kubernetes" # default kubernetes
  template:
    name: "config.env" # file name to store the secret data
    # Export file format following the contents rendering with vault values
    content: |
      {{ with secret "secret/data/project" }}
      {{- range $key, $value := .Data.data }}
      export {{ $key }}={{ $value }}
      {{- end }}
      {{- end }}