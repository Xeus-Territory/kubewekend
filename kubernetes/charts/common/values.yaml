# Default values for common.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- This will define Chart enabled or not
enabled: true

# -- Workload type for this chart. Accepted values: `deployment`. `statefulset` and `daemonset` are not implemented in this chart yet.
deploymentType: deployment

# -- This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# -- This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: nginx
  # -- Image pull policy. Accepted values: `Always`, `IfNotPresent`, `Never`.
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

# -- This will set the command for your application
# Let it null if you already have entrypoint or cmd in your application
# For more information checkout: https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/
command: []
# -- This will set the runtimeArgs for your application
# Let it null if you feel pleasure with cmd command in your application
# Add more if you want to override it
runtimeArgs: []

# -- This sets the environment for your deployment
# For more information checkout: https://kubernetes.io/docs/tasks/inject-data-application/define-environment-variable-container/
env: {}
  # Simple key-value pair name and value environment variables
  # ref: https://kubernetes.io/docs/tasks/inject-data-application/define-environment-variable-container/#define-an-environment-variable-for-a-container
  # Usage:
  # KEY: "value"
  # e.g:
  # ENV_VAR: "your-value-here"
  # 
  # Complex environment variables with valueFrom, e.g: SecretKeyRef, ConfigMapKeyRef, FieldRef or ResourceFieldRef
  # 1. SecretKeyRef ref: https://kubernetes.io/docs/tasks/inject-data-application/distribute-credentials-secure/#define-container-environment-variables-using-secret-data
  # 2. ConfigMapKeyRef ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/#use-configmap-defined-environment-variables-in-pod-commands
  # 3. FieldRef ref: https://kubernetes.io/docs/tasks/inject-data-application/environment-variable-expose-pod-information/#use-pod-fields-as-values-for-environment-variables
  # 4. ResourceFieldRef ref: https://kubernetes.io/docs/tasks/inject-data-application/environment-variable-expose-pod-information/#use-container-fields-as-values-for-environment-variables
  # Usage:
  # 1. SecretKeyRef: ENV_VAR_FROM_SECRET: "secret:secret-name:secret-key"
  # 2. ConfigMapKeyRef: ENV_VAR_FROM_CONFIGMAP: "configmap:configmap-name:configmap-key"
  # 3. FieldRef: ENV_VAR_FROM_FIELD: "field:field-path"
  # 4. ResourceFieldRef: ENV_VAR_FROM_RESOURCE: "resource:resource-name[:divisor]"
  # 4-1. Divisor is optional for rendering the value as a quantity. Default is 1, e.g: "100m" for CPU or "128Mi" for memory. If not set, the raw value will be used.
  # TODO: Support ResourceFieldRef for multiple containers in the future, currently only support for current container
  # e.g:
  # ENV_VAR_FROM_SECRET: "secret:my-secret:password"
  # ENV_VAR_FROM_CONFIGMAP: "configmap:my-configmap:configKey"
  # ENV_VAR_FROM_FIELD: "field:metadata.namespace"
  # ENV_VAR_FROM_RESOURCE: "resource:limits.cpu" or "resource:limits.memory:128Mi"
# -- This sets the envFrom for your deployment, but load entire configmap or secret as environment variables
# ref: https://kubernetes.io/docs/tasks/inject-data-application/define-environment-variable-container/
envFrom: []
  # - configMapRef:
  #     name: my-configmap
  #     optional: false # Set to true to specify whether the ConfigMap or its keys must be defined
  # - secretRef:
  #     name: my-secret
  #     optional: false # Set to true to specify whether the Secret or its keys must be defined

# -- This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# -- This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# -- This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount a ServiceAccount's API credentials?
  automount: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # -- If not set and create is true, a name is generated using the fullname template
  name: ""

# -- This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/ 
podAnnotations: {}
# -- This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# -- This defines the security options the ephemeral container should be run with. 
# If set, the fields of SecurityContext override the equivalent fields of PodSecurityContext.
# For more information checkout: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# -- This holds pod-level security attributes and common container settings.
podSecurityContext: {}
  # fsGroup: 2000

# -- Additional container ports exposed by the main application container.
# If empty, the chart falls back to a single port derived from `service.port` when `service.enabled` is true.
# If you keep the default HTTP probes or Service targetPort behavior, include a port named `http`.
containerPorts: []
  # - name: http
  #   containerPort: 3000
  #   protocol: TCP
  # - name: metrics
  #   containerPort: 9090
  #   protocol: TCP

# -- This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # -- Enable service creation
  enabled: true
  # -- Kubernetes Service type. Accepted values: `ClusterIP`, `NodePort`, `LoadBalancer`, `ExternalName`.
  type: ClusterIP
  # -- External DNS name used only when `service.type=ExternalName`.
  externalName: ""
  # -- Legacy single service port. When `service.ports` is empty, this port is exposed and targets `service.targetPort`.
  port: 80
  # -- Legacy single service targetPort. Accepted values: a container port name such as `http` or a numeric port such as `3000`. Defaults to `http` when not set.
  targetPort: http
  # -- Primary Service port name used by ingress, NOTES, and test hooks when `service.ports` contains multiple entries.
  # -- Leave empty to use the first entry from `service.ports`.
  primaryPortName: ""
  # -- Explicit service ports. Use this when you need multiple service ports or non-default targetPort mappings.
  ports: []
    # - name: web
    #   port: 80
    #   targetPort: http
    #   protocol: TCP
    # - name: metrics
    #   port: 9090
    #   targetPort: metrics
    #   protocol: TCP
  # -- Set this to true to create a headless service
  headless: false

# -- This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- This define resource for your application **(BE CAREFUL TO SET THIS VALUE)**
# Best practice: Not set **cpu limit** for preventing CPU Throttle, 
# set **memory request/limit** for bring up and preventing OOM.
# For more information checkout: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# -- This is to setup the liveness,readiness and startupProbe probes 
# More information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
probes:
  # -- Default probe path used by all HTTP probes when a probe does not set `httpGet.path` explicitly.
  path: /
  # -- Default probe port. Accepted values: a named container port such as `http` or a numeric port such as `3000`.
  # -- Default probe port used by all HTTP probes when a probe does not set `httpGet.port` explicitly.
  # -- Leave empty to auto-select `http`, otherwise the first declared container port name, then the first container port number.
  port: ""
  # -- Probe list to disable. Accepted values: `livenessProbe`, `readinessProbe`, `startupProbe`, `all`.
  # Ex: ["livenessProbe", "readinessProbe"] -> enable `startupProbe` only
  disableProbes: []
  livenessProbe:
    # -- Leave `httpGet` empty to inherit `probes.path` and `probes.port` defaults.
    httpGet: {}
    # httpGet:
    #   path: /healthz
    #   port: http
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 30
    successThreshold: 1
  readinessProbe:
    # -- Leave `httpGet` empty to inherit `probes.path` and `probes.port` defaults.
    httpGet: {}
    # httpGet:
    #   path: /ready
    #   port: http
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 30
    successThreshold: 1
  startupProbe:
    # -- Leave `httpGet` empty to inherit `probes.path` and `probes.port` defaults.
    httpGet: {}
    # httpGet:
    #   path: /
    #   port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30

# -- This set the override probes base on your decision
probesOverride: {}
  # livenessProbe:
  #   ...
  # readinessProbe:
  #   ...
  # startupProbe:
  #   ...

# -- This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# -- Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# -- Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# -- Choose your node to deloy application depend on `label`, for more information: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
nodeSelector: {}

# -- Set for deploy your application into `taint` node, for more information: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
tolerations: []

# -- Functions like the nodeSelector field but is more expressive and allows you to specify soft rules, for more information: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
affinity: {}

# -- To add your extra manifest into your applications
extraManifests: {}

# -- RBAC configuration for this workload.
# Common patterns:
# 1. Create both Role/ClusterRole and RoleBinding/ClusterRoleBinding: `rbac.create=true`
# 2. Create only a binding to a pre-existing role: `rbac.create=false`, `rbac.roleBinding.create=true`
# 3. Create only the role object: `rbac.create=false`, `rbac.role.create=true`
rbac:
  # -- Global default for RBAC object creation. Accepted values: `true`, `false`.
  # -- This is used as the fallback for `rbac.role.create` and `rbac.roleBinding.create` when those values are `null`.
  create: false
  role:
    # -- Per-object override for role creation. Accepted values: `true`, `false`, `null`.
    create: null
    # -- `null` means "follow rbac.create". Set to `false` when you want to bind to a pre-existing `Role` or `ClusterRole`.
    # -- RBAC role kind. Accepted values: `Role`, `ClusterRole`.
    kind: Role
    # -- RBAC role name override. Defaults to the chart fullname.
    name: ""
    # -- RBAC role namespace override. Defaults to `common.namespace`. Ignored for `ClusterRole`.
    namespace: ""
    annotations: {}
    rules: []
      # - apiGroups: [""]
      #   resources: ["pods"]
      #   verbs: ["get", "list", "watch"]
  roleBinding:
    # -- Per-object override for binding creation. Accepted values: `true`, `false`, `null`.
    create: null
    # -- `null` means "follow rbac.create". Set to `true` when you want to create only the binding for a pre-existing `roleRef`.
    # -- RBAC binding kind. Accepted values: `""` (auto), `RoleBinding`, `ClusterRoleBinding`.
    # -- `""` means auto-select: `RoleBinding` for `Role`, `ClusterRoleBinding` for `ClusterRole`.
    kind: ""
    # -- RBAC binding name override. Defaults to the chart fullname.
    name: ""
    # -- RBAC binding namespace override. Defaults to `common.namespace`. Ignored for `ClusterRoleBinding`.
    namespace: ""
    annotations: {}
    roleRef: {}
      # apiGroup: rbac.authorization.k8s.io
      # kind: Role # Accepted values usually follow `rbac.role.kind`: `Role` or `ClusterRole`
      # name: my-role # Defaults to `rbac.role.name` if set, otherwise the chart fullname
    subjects: []
      # - kind: ServiceAccount
      #   name: my-service-account
      #   namespace: default

# -- To enable/disable the testconnection for deployment
testConnection: false

# -- Setup Pod Disruption Budget for your application
# More information can be found here: https://kubernetes.io/docs/concepts/workloads/pods/disruptions/
pdb:
  create: false
  minAvailable: 1
  maxUnavailable: 0

# -- Setup Vault Agent sidecar for injecting secrets into your application
# More information can be found here: https://developer.hashicorp.com/vault/docs/deploy/kubernetes/injector
# More annotation with Vault Injector Configuration here: https://developer.hashicorp.com/vault/docs/deploy/kubernetes/injector/annotations
vault:
  enabled: false
  # These value are only required when `template.type = annotation`
  config:
    path: "secret/data/project" # vault secret path
    role: "vault-role"        # vault k8s auth role
    serviceServer: "https://vault.svc.cluster.local:8200" # vault server address
    namespace: "default" # vault namespace
    # Auth method to use for Vault Agent sidecar
    # Options: kubernetes | token | etc (see https://developer.hashicorp.com/vault/docs/auth)
    authPath: "auth/kubernetes" # default kubernetes
  template:
    name: "config.env" # file name to store the secret data
    # Export file format following the contents rendering with vault values
    content: |
      {{ with secret "secret/data/project" }}
      {{- range $key, $value := .Data.data }}
      export {{ $key }}={{ $value }}
      {{- end }}
      {{- end }}