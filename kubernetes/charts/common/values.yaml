# Default values for common.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- This will define Chart enabled or not.
# The chart always renders a `Deployment`; StatefulSet and DaemonSet workloads are out of scope (use a dedicated chart).
enabled: true

# -- This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# -- Number of old ReplicaSets kept for `kubectl rollout undo`. Leave `null` to use the Kubernetes default (`10`).
revisionHistoryLimit: null

# -- Seconds a new pod must stay Ready (without crashing) before it counts as available during a rollout.
# Leave `null` to use the Kubernetes default (`0`).
minReadySeconds: null

# -- Deployment update strategy, more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
# Accepted `type` values: `RollingUpdate` (Kubernetes default) or `Recreate`. `rollingUpdate` must be empty when `type` is `Recreate`.
strategy: {}
  # type: RollingUpdate
  # rollingUpdate:
  #   maxSurge: 25%
  #   maxUnavailable: 25%

# -- This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: nginx
  # -- Image pull policy. Accepted values: `Always`, `IfNotPresent`, `Never`.
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

# -- This will set the command for your application
# Let it null if you already have entrypoint or cmd in your application
# For more information checkout: https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/
command: []
# -- This will set the runtimeArgs for your application
# Let it null if you feel pleasure with cmd command in your application
# Add more if you want to override it
runtimeArgs: []

# -- This sets the environment for your deployment
# For more information checkout: https://kubernetes.io/docs/tasks/inject-data-application/define-environment-variable-container/
env: {}
  # Simple key-value pair name and value environment variables
  # ref: https://kubernetes.io/docs/tasks/inject-data-application/define-environment-variable-container/#define-an-environment-variable-for-a-container
  # Usage:
  # KEY: "value"
  # e.g:
  # ENV_VAR: "your-value-here"
  # 
  # Complex environment variables with valueFrom, e.g: SecretKeyRef, ConfigMapKeyRef, FieldRef or ResourceFieldRef
  # 1. SecretKeyRef ref: https://kubernetes.io/docs/tasks/inject-data-application/distribute-credentials-secure/#define-container-environment-variables-using-secret-data
  # 2. ConfigMapKeyRef ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/#use-configmap-defined-environment-variables-in-pod-commands
  # 3. FieldRef ref: https://kubernetes.io/docs/tasks/inject-data-application/environment-variable-expose-pod-information/#use-pod-fields-as-values-for-environment-variables
  # 4. ResourceFieldRef ref: https://kubernetes.io/docs/tasks/inject-data-application/environment-variable-expose-pod-information/#use-container-fields-as-values-for-environment-variables
  # Usage:
  # 1. SecretKeyRef: ENV_VAR_FROM_SECRET: "secret:secret-name:secret-key"
  # 2. ConfigMapKeyRef: ENV_VAR_FROM_CONFIGMAP: "configmap:configmap-name:configmap-key"
  # 3. FieldRef: ENV_VAR_FROM_FIELD: "field:field-path"
  # 4. ResourceFieldRef: ENV_VAR_FROM_RESOURCE: "resource:resource-name[:divisor]"
  # 4-1. Divisor is optional for rendering the value as a quantity. Default is 1, e.g: "100m" for CPU or "128Mi" for memory. If not set, the raw value will be used.
  # TODO: Support ResourceFieldRef for multiple containers in the future, currently only support for current container
  # e.g:
  # ENV_VAR_FROM_SECRET: "secret:my-secret:password"
  # ENV_VAR_FROM_CONFIGMAP: "configmap:my-configmap:configKey"
  # ENV_VAR_FROM_FIELD: "field:metadata.namespace"
  # ENV_VAR_FROM_RESOURCE: "resource:limits.cpu" or "resource:limits.memory:128Mi"
# -- This sets the envFrom for your deployment, but load entire configmap or secret as environment variables
# ref: https://kubernetes.io/docs/tasks/inject-data-application/define-environment-variable-container/
envFrom: []
  # - configMapRef:
  #     name: my-configmap
  #     optional: false # Set to true to specify whether the ConfigMap or its keys must be defined
  # - secretRef:
  #     name: my-secret
  #     optional: false # Set to true to specify whether the Secret or its keys must be defined

# -- This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# -- This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# -- This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Automatically mount a ServiceAccount's API credentials?
  automount: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # -- If not set and create is true, a name is generated using the fullname template
  name: ""

# -- Annotations on the Deployment object itself (not the pods, use `podAnnotations` for those). Templates are allowed.
# For tools that read Deployment metadata, e.g.:
# - Reloader, restart on ConfigMap/Secret change: `reloader.stakater.com/auto: "true"`,
#   or targeted `configmap.reloader.stakater.com/reload: "my-config"` / `secret.reloader.stakater.com/reload: "my-secret"`
# - Argo CD ordering: `argocd.argoproj.io/sync-wave: "1"`
# - Image updaters, policy exceptions, ownership / contact metadata
deploymentAnnotations: {}
  # reloader.stakater.com/auto: "true"

# -- This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# -- This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# -- This defines the security options the ephemeral container should be run with. 
# If set, the fields of SecurityContext override the equivalent fields of PodSecurityContext.
# For more information checkout: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# -- This holds pod-level security attributes and common container settings.
podSecurityContext: {}
  # fsGroup: 2000

# -- Additional container ports exposed by the main application container.
# If empty, the chart falls back to a single port derived from `service.port` when `service.enabled` is true.
# If you keep the default HTTP probes or Service targetPort behavior, include a port named `http`.
containerPorts: []
  # - name: http
  #   containerPort: 3000
  #   protocol: TCP
  # - name: metrics
  #   containerPort: 9090
  #   protocol: TCP

# -- This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # -- Enable service creation
  enabled: true
  # -- Kubernetes Service type. Accepted values: `ClusterIP`, `NodePort`, `LoadBalancer`, `ExternalName`.
  type: ClusterIP
  # -- External DNS name used only when `service.type=ExternalName`.
  externalName: ""
  # -- Legacy single service port. When `service.ports` is empty, this port is exposed and targets `service.targetPort`.
  port: 80
  # -- Legacy single service targetPort. Accepted values: a container port name such as `http` or a numeric port such as `3000`. Defaults to `http` when not set.
  targetPort: http
  # -- Primary Service port name used by ingress, NOTES, and test hooks when `service.ports` contains multiple entries.
  # -- Leave empty to use the first entry from `service.ports`.
  primaryPortName: ""
  # -- Explicit service ports. Use this when you need multiple service ports or non-default targetPort mappings.
  ports: []
    # - name: web
    #   port: 80
    #   targetPort: http
    #   protocol: TCP
    # - name: metrics
    #   port: 9090
    #   targetPort: metrics
    #   protocol: TCP
  # -- Set this to true to create a headless service
  headless: false

# -- This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  # -- IngressClass name. Use `traefik` for the Traefik ingress controller (bundled with K3s, or installed via its Helm chart).
  className: ""
  annotations: {}
    # traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # traefik.ingress.kubernetes.io/router.tls: "true"
    # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Expose the Service through the Gateway API with an `HTTPRoute`, more information can be found here: https://gateway-api.sigs.k8s.io/api-types/httproute/
# Requires the Gateway API CRDs and a Gateway controller (e.g. Traefik with `providers.kubernetesGateway.enabled=true`).
# Each rule routes to the primary Service port (`service.primaryPortName`) unless it sets its own `backendRefs`.
httpRoute:
  # -- Enable HTTPRoute creation. Requires `service.enabled=true`.
  enabled: false
  # -- Annotations to add to the HTTPRoute
  annotations: {}
  # -- Gateways this route attaches to. Defaults follow the Traefik Helm chart Gateway (`traefik-gateway`, listener `web`).
  parentRefs:
    - name: traefik-gateway
      sectionName: web
      # namespace: traefik
  # -- Hostnames matched by this route
  hostnames:
    - chart-example.local
  # -- Routing rules. Leave empty to route every request to the Service.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # filters:
      #   - type: RequestHeaderModifier
      #     requestHeaderModifier:
      #       set:
      #         - name: X-Kubewekend
      #           value: "true"
      # backendRefs: # Optional override, e.g. for canary/weighted routing
      #   - name: my-service
      #     port: 80
      #     weight: 100

# -- This define resource for your application **(BE CAREFUL TO SET THIS VALUE)**
# Best practice: Not set **cpu limit** for preventing CPU Throttle, 
# set **memory request/limit** for bring up and preventing OOM.
# For more information checkout: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# -- This is to setup the liveness,readiness and startupProbe probes 
# More information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
probes:
  # -- Default probe path used by all HTTP probes when a probe does not set `httpGet.path` explicitly.
  path: /
  # -- Default probe port. Accepted values: a named container port such as `http` or a numeric port such as `3000`.
  # -- Default probe port used by all HTTP probes when a probe does not set `httpGet.port` explicitly.
  # -- Leave empty to auto-select `http`, otherwise the first declared container port name, then the first container port number.
  port: ""
  # -- Probe list to disable. Accepted values: `livenessProbe`, `readinessProbe`, `startupProbe`, `all`.
  # Ex: ["livenessProbe", "readinessProbe"] -> enable `startupProbe` only
  disableProbes: []
  livenessProbe:
    # -- Leave `httpGet` empty to inherit `probes.path` and `probes.port` defaults.
    httpGet: {}
    # httpGet:
    #   path: /healthz
    #   port: http
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 30
    successThreshold: 1
  readinessProbe:
    # -- Leave `httpGet` empty to inherit `probes.path` and `probes.port` defaults.
    httpGet: {}
    # httpGet:
    #   path: /ready
    #   port: http
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 30
    successThreshold: 1
  startupProbe:
    # -- Leave `httpGet` empty to inherit `probes.path` and `probes.port` defaults.
    httpGet: {}
    # httpGet:
    #   path: /
    #   port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30

# -- This set the override probes base on your decision
probesOverride: {}
  # livenessProbe:
  #   ...
  # readinessProbe:
  #   ...
  # startupProbe:
  #   ...

# -- Lifecycle hooks for the main container, more information can be found here: https://kubernetes.io/docs/concepts/containers/container-lifecycle-hooks/
# A `preStop` sleep gives Service endpoints and ingress/gateway time to stop sending traffic before the container receives SIGTERM,
# which avoids failed requests during rollouts. Keep `terminationGracePeriodSeconds` larger than the preStop duration.
lifecycle: {}
  # preStop:
  #   sleep:
  #     seconds: 10 # native sleep action (Kubernetes >= 1.30); use `exec: {command: ["sleep", "10"]}` on older clusters
  # postStart:
  #   exec:
  #     command: ["/bin/sh", "-c", "echo started"]

# -- This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# -- Prometheus Operator `ServiceMonitor` that scrapes the Service, more information: https://prometheus-operator.dev/docs/developer/getting-started/
# Requires the Prometheus Operator CRDs (e.g. kube-prometheus-stack) and `service.enabled=true`.
# Enable `serviceMonitor` or `podMonitor` for the same metrics port, not both, otherwise every target is scraped twice.
serviceMonitor:
  # -- Enable ServiceMonitor creation
  enabled: false
  # -- Namespace for the ServiceMonitor. Empty means the release namespace; when set, `namespaceSelector` targets the release namespace.
  namespace: ""
  # -- Extra labels, e.g. `release: kube-prometheus-stack` so that Prometheus' `serviceMonitorSelector` picks it up
  labels: {}
  # -- Annotations to add to the ServiceMonitor
  annotations: {}
  # -- Service port **name** to scrape. Must exist in `service.ports` (or be `http` for the legacy single `service.port`).
  port: metrics
  # -- HTTP path of the metrics endpoint
  path: /metrics
  # -- Scrape interval. Empty uses the Prometheus default.
  interval: 30s
  # -- Scrape timeout, must be lower than `interval`. Empty uses the Prometheus default.
  scrapeTimeout: ""
  # -- Scrape scheme (`http` or `https`). Empty uses `http`.
  scheme: ""
  # -- TLS settings for `https` scraping
  tlsConfig: {}
  # -- Keep the labels exposed by the target when they conflict with Prometheus target labels
  honorLabels: false
  # -- Relabelings applied before scraping
  relabelings: []
  # -- Relabelings applied to scraped samples before ingestion
  metricRelabelings: []

# -- Prometheus Operator `PodMonitor` that scrapes the pods directly (no Service needed), more information: https://prometheus-operator.dev/docs/developer/getting-started/
# Requires the Prometheus Operator CRDs (e.g. kube-prometheus-stack).
podMonitor:
  # -- Enable PodMonitor creation
  enabled: false
  # -- Namespace for the PodMonitor. Empty means the release namespace; when set, `namespaceSelector` targets the release namespace.
  namespace: ""
  # -- Extra labels, e.g. `release: kube-prometheus-stack` so that Prometheus' `podMonitorSelector` picks it up
  labels: {}
  # -- Annotations to add to the PodMonitor
  annotations: {}
  # -- Container port **name** of the main container to scrape. Must exist in `containerPorts` (or be `http` for the implicit Service-derived port).
  port: metrics
  # -- HTTP path of the metrics endpoint
  path: /metrics
  # -- Scrape interval. Empty uses the Prometheus default.
  interval: 30s
  # -- Scrape timeout, must be lower than `interval`. Empty uses the Prometheus default.
  scrapeTimeout: ""
  # -- Scrape scheme (`http` or `https`). Empty uses `http`.
  scheme: ""
  # -- TLS settings for `https` scraping
  tlsConfig: {}
  # -- Keep the labels exposed by the target when they conflict with Prometheus target labels
  honorLabels: false
  # -- Relabelings applied before scraping
  relabelings: []
  # -- Relabelings applied to scraped samples before ingestion
  metricRelabelings: []

# -- Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# -- Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# -- Mount an existing PersistentVolumeClaim into the main container, more information: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
# The chart does not create PVCs: create the claim first (or let another chart own it), then reference it here.
# For one volume per pod (databases, stateful middleware) use a StatefulSet-based chart instead.
# Other containers (`initContainers` / `extraContainers`) can mount the same volume by `persistence.volumeName`.
persistence:
  # -- Enable mounting the existing claim
  enabled: false
  # -- Name of the existing PVC (supports templates, e.g. `"{{ .Release.Name }}-data"`). Required when enabled.
  existingClaim: ""
  # -- Access mode of the existing claim, used for safety checks only. Accepted values: `ReadWriteOnce`, `ReadWriteOncePod`, `ReadWriteMany`, `ReadOnlyMany`.
  # `ReadWriteOncePod` fails rendering unless the pod count is 1 and `strategy.type=Recreate`;
  # `ReadWriteOnce` prints a NOTES warning when more than one pod may run or the strategy is RollingUpdate.
  accessMode: ReadWriteOnce
  # -- Pod volume name; must not clash with entries in `volumes`
  volumeName: data
  # -- Path where the claim is mounted in the main container
  mountPath: /data
  # -- Optional sub-path inside the volume to mount
  subPath: ""
  # -- Mount the claim read-only
  readOnly: false

# -- Init containers that run to completion before the main container starts, more information: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
# Use for database migrations, waiting for dependencies, or preparing files in a shared volume.
# Native sidecars (Kubernetes >= 1.29): an init container with `restartPolicy: Always` keeps running alongside the main container
# and is started before / stopped after it, more information: https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/
# Rendered as-is (templates allowed); ports, probes and NOTES of the chart keep targeting the main container.
initContainers: []
  # - name: migrate
  #   image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
  #   command: ["/bin/sh", "-c", "yarn run migrate"]
  # - name: log-shipper # native sidecar
  #   image: fluent/fluent-bit:3.2
  #   restartPolicy: Always
  #   volumeMounts:
  #     - name: logs
  #       mountPath: /var/log/app

# -- Additional containers that run next to the main container for the whole pod lifetime (classic sidecars).
# Prefer a native sidecar in `initContainers` (with `restartPolicy: Always`) when it must start before the app.
# Rendered as-is (templates allowed); each extra container defines its own ports, probes and resources.
extraContainers: []
  # - name: oauth2-proxy
  #   image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
  #   args: ["--upstream=http://127.0.0.1:3000", "--http-address=0.0.0.0:4180"]
  #   ports:
  #     - name: proxy
  #       containerPort: 4180

# -- Choose your node to deloy application depend on `label`, for more information: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
nodeSelector: {}

# -- Set for deploy your application into `taint` node, for more information: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
tolerations: []

# -- Functions like the nodeSelector field but is more expressive and allows you to specify soft rules, for more information: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
affinity: {}

# -- Shortcut that spreads the replicas of this release apart with pod anti-affinity against its own pods.
# `soft`: preferred, the scheduler still co-locates replicas when it has no other choice.
# `hard`: required, a replica stays `Pending` when no domain is free, so keep `replicaCount` (plus RollingUpdate `maxSurge`)
# at or below the number of eligible nodes / zones, or use `strategy.rollingUpdate.maxSurge: 0`.
# Merged into `affinity` (works together with `affinity.nodeAffinity`); cannot be combined with `affinity.podAntiAffinity`.
podAntiAffinityPreset:
  # -- Accepted values: `""` (disabled), `soft`, `hard`
  type: ""
  # -- Topology domain to spread across, e.g. `kubernetes.io/hostname` (nodes) or `topology.kubernetes.io/zone` (zones)
  topologyKey: kubernetes.io/hostname
  # -- Weight of the `soft` preference (1-100)
  weight: 1

# -- Spread pods across nodes or zones, for more information: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
# When a constraint omits `labelSelector`, the chart's selector labels are used, so pods of this release spread against each other.
topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: kubernetes.io/hostname
  #   whenUnsatisfiable: ScheduleAnyway
  # - maxSkew: 1
  #   topologyKey: topology.kubernetes.io/zone
  #   whenUnsatisfiable: DoNotSchedule

# -- Scheduler that places the pods. Leave empty to use the cluster default (`default-scheduler`).
schedulerName: ""

# -- PriorityClass for the pods; the PriorityClass must already exist in the cluster, for more information: https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/
priorityClassName: ""

# -- RuntimeClass for the pods, for more information: https://kubernetes.io/docs/concepts/containers/runtime-class/
# Leave empty to use the node's default container runtime handler (the right choice for most workloads).
# Set it when the workload needs a specific runtime handler, and the RuntimeClass must already exist in the cluster:
# 1. GPU via device plugin: use the `nvidia` RuntimeClass (created by the NVIDIA GPU Operator; on K3s/RKE2 the bundled containerd
#    registers an `nvidia` handler when nvidia-container-runtime is installed, check with `kubectl get runtimeclass`).
#    Pair it with `resources.limits` (e.g. `nvidia.com/gpu: 1`) and GPU `tolerations` / `nodeSelector`.
# 2. Sandboxed runtimes such as `gvisor` or `kata`.
# A RuntimeClass with `scheduling.nodeSelector` / `tolerations` also steers pods onto nodes that have that runtime.
runtimeClassName: ""

# -- Seconds the pod gets to shut down after SIGTERM (the `lifecycle.preStop` hook counts against it) before it is killed.
# Leave `null` to use the Kubernetes default (`30`).
terminationGracePeriodSeconds: null

# -- To add your extra manifest into your applications
extraManifests: {}

# -- RBAC configuration for this workload.
# Common patterns:
# 1. Create both Role/ClusterRole and RoleBinding/ClusterRoleBinding: `rbac.create=true`
# 2. Create only a binding to a pre-existing role: `rbac.create=false`, `rbac.roleBinding.create=true`
# 3. Create only the role object: `rbac.create=false`, `rbac.role.create=true`
rbac:
  # -- Global default for RBAC object creation. Accepted values: `true`, `false`.
  # -- This is used as the fallback for `rbac.role.create` and `rbac.roleBinding.create` when those values are `null`.
  create: false
  role:
    # -- Per-object override for role creation. Accepted values: `true`, `false`, `null`.
    create: null
    # -- `null` means "follow rbac.create". Set to `false` when you want to bind to a pre-existing `Role` or `ClusterRole`.
    # -- RBAC role kind. Accepted values: `Role`, `ClusterRole`.
    kind: Role
    # -- RBAC role name override. Defaults to the chart fullname.
    name: ""
    # -- RBAC role namespace override. Defaults to `common.namespace`. Ignored for `ClusterRole`.
    namespace: ""
    annotations: {}
    rules: []
      # - apiGroups: [""]
      #   resources: ["pods"]
      #   verbs: ["get", "list", "watch"]
  roleBinding:
    # -- Per-object override for binding creation. Accepted values: `true`, `false`, `null`.
    create: null
    # -- `null` means "follow rbac.create". Set to `true` when you want to create only the binding for a pre-existing `roleRef`.
    # -- RBAC binding kind. Accepted values: `""` (auto), `RoleBinding`, `ClusterRoleBinding`.
    # -- `""` means auto-select: `RoleBinding` for `Role`, `ClusterRoleBinding` for `ClusterRole`.
    kind: ""
    # -- RBAC binding name override. Defaults to the chart fullname.
    name: ""
    # -- RBAC binding namespace override. Defaults to `common.namespace`. Ignored for `ClusterRoleBinding`.
    namespace: ""
    annotations: {}
    roleRef: {}
      # apiGroup: rbac.authorization.k8s.io
      # kind: Role # Accepted values usually follow `rbac.role.kind`: `Role` or `ClusterRole`
      # name: my-role # Defaults to `rbac.role.name` if set, otherwise the chart fullname
    subjects: []
      # - kind: ServiceAccount
      #   name: my-service-account
      #   namespace: default

# -- To enable/disable the testconnection for deployment
testConnection: false

# -- Setup Pod Disruption Budget for your application
# More information can be found here: https://kubernetes.io/docs/concepts/workloads/pods/disruptions/
pdb:
  create: false
  minAvailable: 1
  maxUnavailable: 0

# -- Setup Vault Agent sidecar for injecting secrets into your application
# More information can be found here: https://developer.hashicorp.com/vault/docs/deploy/kubernetes/injector
# More annotation with Vault Injector Configuration here: https://developer.hashicorp.com/vault/docs/deploy/kubernetes/injector/annotations
vault:
  enabled: false
  # These value are only required when `template.type = annotation`
  config:
    path: "secret/data/project" # vault secret path
    role: "vault-role"        # vault k8s auth role
    serviceServer: "https://vault.svc.cluster.local:8200" # vault server address
    namespace: "default" # vault namespace
    # Auth method to use for Vault Agent sidecar
    # Options: kubernetes | token | etc (see https://developer.hashicorp.com/vault/docs/auth)
    authPath: "auth/kubernetes" # default kubernetes
  template:
    name: "config.env" # file name to store the secret data
    # Export file format following the contents rendering with vault values
    content: |
      {{ with secret "secret/data/project" }}
      {{- range $key, $value := .Data.data }}
      export {{ $key }}={{ $value }}
      {{- end }}
      {{- end }}