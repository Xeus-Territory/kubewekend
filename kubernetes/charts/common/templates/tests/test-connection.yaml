{{- if and .Values.testConnection .Values.service.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "common.fullname" . }}-test-connection"
  labels:
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "common.fullname" . }}:{{ include "common.service.primaryPort" . }}']
  restartPolicy: Never
{{- end -}}
