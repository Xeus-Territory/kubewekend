<!-- Light / dark mode. The theme's light stylesheet always loads; the dark stylesheet is a second layer written
     here while the page is parsed, so the browser waits for it and the first paint already has the right colours
     (no flash on navigation). Switching only flips that layer's `media`: both files are cached, so it is instant,
     with a short colour fade. A saved choice wins, otherwise the system setting is followed.
     The button lives in _includes/header_custom.html; diagram colours in _includes/mermaid_config.js. -->
<script>
  (function () {
    var KEY = "kw-theme";
    var DARK_CSS = "{{ '/assets/css/just-the-docs-kubewekend-dark.css' | relative_url }}";
    var MERMAID = "https://cdn.jsdelivr.net/npm/mermaid@{{ site.mermaid.version }}/dist/mermaid.esm.min.mjs";
    var root = document.documentElement;
    var system = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
    var memo = null; // fallback when localStorage is blocked

    function saved() {
      try { return localStorage.getItem(KEY) || memo; } catch (e) { return memo; }
    }
    function current() {
      return saved() || (system && system.matches ? "dark" : "light");
    }
    // The dark layer is forced on / off by a saved choice, otherwise it follows the system setting
    function darkMedia() {
      var s = saved();
      return s === "dark" ? "all" : s === "light" ? "not all" : "(prefers-color-scheme: dark)";
    }

    document.write('<link rel="stylesheet" id="kw-dark-css" href="' + DARK_CSS + '" media="' + darkMedia() + '">');
    root.setAttribute("data-kw-theme", current());

    // Keep each Mermaid source before it is drawn (module scripts run after this event), to redraw on switch
    document.addEventListener("readystatechange", function () {
      if (document.readyState !== "interactive") return;
      document.querySelectorAll("code.language-mermaid").forEach(function (el) {
        el.setAttribute("data-kw-src", el.textContent);
      });
    });

    function redrawMermaid(mode) {
      var nodes = document.querySelectorAll("code.language-mermaid[data-kw-src]");
      if (!nodes.length) return;
      import(MERMAID).then(function (m) {
        m.default.initialize({ theme: mode === "dark" ? "dark" : "default" });
        nodes.forEach(function (el) {
          el.removeAttribute("data-processed");
          el.textContent = el.getAttribute("data-kw-src");
        });
        return m.default.run({ nodes: nodes });
      }).catch(function () {});
    }

    function apply(mode) {
      root.classList.add("kw-theme-transition");
      window.getComputedStyle(root).color; // commit the transition rules before the colours change
      document.getElementById("kw-dark-css").media = darkMedia();
      root.setAttribute("data-kw-theme", mode);
      redrawMermaid(mode);
      window.setTimeout(function () { root.classList.remove("kw-theme-transition"); }, 400);
    }

    window.kwToggleTheme = function () {
      var mode = current() === "dark" ? "light" : "dark";
      memo = mode;
      try { localStorage.setItem(KEY, mode); } catch (e) {}
      apply(mode);
    };

    if (system && system.addEventListener) {
      system.addEventListener("change", function () {
        if (!saved()) apply(current());
      });
    }
  })();
</script>
