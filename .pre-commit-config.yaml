---
repos:
  - repo: https://github.com/norwoodj/helm-docs
    rev:  "v1.14.2"
    hooks:
      - id: helm-docs
        args:
          # Make the tool search for charts only under the `charts` directory
          - --chart-search-root=kubernetes/charts
          - --template-files=README.md.gotmpl

  # Validate pinned versions (every registry entry found, one version each) and regenerate the
  # "Versions" tables in README.md and docs/reference/versions.md from VERSION_REGISTRY in scripts/lib/versions_registry.sh.
  # When the tables change the hook rewrites the files and pre-commit fails once, like helm-docs: review,
  # stage and commit again.
  - repo: local
    hooks:
      - id: kubewekend-versions-sync
        name: Sync README.md / docs Versions tables
        entry: ./scripts/setup.sh versions sync
        language: system
        pass_filenames: false
        files: ^(ansible/|kubernetes/charts/[^/]+/Chart\.yaml$|examples/|\.github/workflows/|\.pre-commit-config\.yaml$|_config\.yml$|requirements\.txt$|README\.md$|docs/reference/versions\.md$|scripts/(setup\.sh|lib/))

  # Check setup.sh whenever you add or change something (scripts/checks/check_setup.py, a few seconds, no cluster):
  # syntax, shellcheck (when installed), UTILITY_REGISTRY / SETUP_REGISTRY_* vs the playbook tags and master.yaml,
  # the master.yaml layout the shell parser relies on, stale wording (scripts/checks/stale-phrases.txt), the help
  # screens, and `setup.sh config validate`. A failure prints `file:line: message`. Run one check alone with
  # `python3 scripts/checks/check_setup.py --only registry`.
  - repo: local
    hooks:
      - id: kubewekend-setup-checks
        name: Check setup.sh against the playbooks and master.yaml
        entry: python3 scripts/checks/check_setup.py
        language: system
        pass_filenames: false
        files: ^(scripts/(setup\.sh|lib/|checks/)|ansible/|README\.md$|docs/|\.pre-commit-config\.yaml$)
