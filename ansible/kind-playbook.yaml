    # Setup GatewayAPI for Kind Cluster (Traefik only)
    - name: Setup GatewayAPI for Kind cluster
      tags: setup_kind
      when: kindCluster.apigateway.enable | default(false)
      block:
        # Documentation: https://gateway-api.sigs.k8s.io/docs/introduction/
        # GitHub: https://github.com/kubernetes-sigs/gateway-api
        - name: Install GatewayAPI CRD for Kind cluster (Force the installed)
          tags: setup_kind
          when: kindCluster.apigateway.crd.install | default(false)
          ansible.builtin.shell: |-
            kubectl apply --server-side --force-conflicts -f https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ kindCluster.apigateway.crd.version }}/standard-install.yaml
          register: gatewayapi_log
          changed_when: false

        - name: Log the results of Install GatewayAPI CRD for Kind cluster
          tags: setup_kind
          ansible.builtin.debug:
            msg: "{{ gatewayapi_log.stdout_lines }}"
          when: kindCluster.apigateway.crd.install | default(false)

        # Install Traefik Gateway API
        # Documentation: https://doc.traefik.io/traefik/getting-started/kubernetes/
        # Helm-Chart: https://artifacthub.io/packages/helm/traefik/traefik
        - name: Install Traefik GatewayAPI for Kind cluster (Including Traefik Ingress Controller)
          tags: setup_kind
          when: kindCluster.apigateway.class == 'traefik'
          ansible.builtin.shell: |-
            helm repo add traefik https://helm.traefik.io/traefik
            helm repo update
            helm upgrade --install traefik traefik/traefik --version 42.0.0 --wait \
              --namespace kube-system \
              --reuse-values \
              --set gateway.enabled=true \
              --set providers.kubernetesGateway.enabled=true \
              --set gateway.listeners.web.namespacePolicy.from=All
          register: traefik_gateway_log
          changed_when: false
        
        - name: Log the results of Install Traefik GatewayAPI for Kind cluster (Including Traefik Ingress Controller)
          tags: setup_kind
          ansible.builtin.debug:
            msg: "{{ traefik_gateway_log.stdout_lines }}"
          when: kindCluster.apigateway.class == 'traefik'

