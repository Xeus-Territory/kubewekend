kindCluster:
  networking:
    apiServer:
      address: "127.0.0.1"
      port: 6443
    podSubnet: "10.244.0.0/16"
    serviceSubnet: "10.96.0.0/16"
    # NOTE: only one CNI can be used, and it requires for scheduling pods
    # Supported CNI: calico, flannel, cilium
    disableDefaultCNI: false # Disable default CNI (kindnetd), when set to true, you need to manually setup CNI like calico, flannel, cilium
    cni: "cilium" # calico | flannel | cilium if disableDefaultCNI is true
    kubeProxyMode: "iptables" # iptables | nftables (v1.31+) | ipvs | none
  # Kubernetes version for kind node image, find more at https://hub.docker.com/r/kindest/node/
  # Stable Version (Recommended): v1.28.9, v1.28.15, v1.29.14, v1.30.13, v1.31.14, v1.32.11, v1.33.7, v1.34.3 (latest)  
  image: "kindest/node:v1.28.9"
  loadbalancer:
    enable: true
    type: "cloud-provider-kind"  # metallb | cloud-provider-kind | cilium-ipam-lb (requires cilium CNI)
    ippool:
      # Only use for metallb, ignore if use cloud-provider-kind or cilium-ipam-lb
      # For using as subnetmask or cidr range format (NOTE: same network of docker kind (172.18.0.0/16) bridge with VIP)
      # IF you define another range for kind bridge network, please make sure the ippool is in the same range
      cidr: "172.18.255.2 - 172.18.255.254" 
  ingress:
    enable: true
    class: "traefik"  # nginx | traefik | cilium | kong
  apigateway:
    enable: true
    crd:
      # Install GatewayAPI CRD if not present
      # NOTE: In these situations, you shoudldn't enable this option:
      # 1. CloudProvider Kind Load Balancer Enabled (Already include GatewayAPI CRD)
      # 2. Traefik Ingress Controller Enabled (Already include GatewayAPI CRD)
      install: false
      version: "v1.2.0"  # Install GatewayAPI CRD if not present, versions: v1.2.0 (Compatible with Cilium API Gateway) | v1.4.1 (Latest)
    class: "traefik" # none | kong | cilium | traefik (traefik-gateway)
    # NOTE: This feature is only support for Kong API Gateway
    # Purpose: Setup API Gateway to be internal only (accessible only inside the cluster) combined with LoadBalancer service type
    # Like Other Ingress in situation only one LoadBalancer IP available for multiple Ingress and API Gateway
    kong:
      internalOnly: false # true | false
      admin: false # true | false Enable Kong Admin API Service (for Kong Manager UI and Kong Admin API access)
      ingressClass: "traefik" # IngressClass for Kong API Gateway when internalOnly is true
      internalHostname: "kong-internal.local" # Hostname for Kong API Gateway when internalOnly is true
  # Forward network ports from host to kind cluster and let's you access services from host machine directly by iptables rules
  networkForwarding:
    enable: true

k3sCluster:
  ################### NOTICE ####################################################
  ## This configuration is setup for master node, including
  ## 1. Fix Registration Master
  ## 2. Sever Master Join to cluster for HA cluster setup
  ## Read more at: https://docs.k3s.io/architecture#high-availability-k3s
  ## Server configuration at: https://docs.k3s.io/cli/server
  ###############################################################################

  # Kubernetes version for k3s, find more at https://github.com/k3s-io/k3s/releases
  # Stable Version (Recommended): v1.28.9+k3s1, v1.32.13+k3s1, v1.33.9+k3s1, v1.34.5+k3s1, v1.35.2+k3s1 (latest)
  version: "v1.34.5+k3s1"
  # Number of control-plane nodes, default is 1, and set to 3 for HA Cluster
  # NOTE: For HA Cluster, you need to setup an external database like etcd or postgres, and use external load balancer for control-plane nodes
  # By default, K3s will use etcd when you setup HA cluster with 3 control-plane nodes, and with stanalone embedded SQLite when you setup single control-plane node cluster
  # Read more at: https://docs.k3s.io/architecture#high-availability-k3s
  highAvailability:
    enable: true
    replicas: 3
    # Use dataStorage when you want to setup HA cluster
    # Read more at: ETCD - https://docs.k3s.io/datastore/ha-embedded, Postgres - https://docs.k3s.io/datastore/ha
    dataStorage:
      externalDatabase:
        type: "etcd" # postgres | etcd
        # Only use for postgres, ignore if you use etcd
        host: "127.0.0.1"
        port: 5432
        user: "postgres"
        password: "postgres"
        database: "postgres"
        sslmode: "require" # disable | require | verify-ca | verify-full
    # If you setup HA cluster with multiple control-plane nodes, You can setup the cluster load balancer for ensure the API Server high-availability
    # Read more at: https://docs.k3s.io/datastore/cluster-loadbalancer
    clusterLB:
      enable: false # true if your cluster is set to HA
      type: "HAProxy" # HAProxy | Kube-Vip
  
  # Add additional SANs for the API server certificate, default is "localhost" and "127.0.0.1"
  tlsSANs:
    - "k3s.local"
    - "localhost"
    - "127.0.0.1"
  # Registering and starting kubelet with set of labels
  nodeLabels:
    - "machine-type=cpu"
  # Registering kubelet with set of taints
  nodeTaints: []
  # NOTE: only one CNI can be used, and it requires for scheduling pods
  # Supported CNI: flannel, calico, cilium
  # By default, k3s use flannel as CNI with VXLAN Backend, Read more at: https://docs.k3s.io/networking/basic-network-options?cni=Calico#flannel-options
  # For production cluster, it's recommended to use calico or cilium for better performance and security features
  # Read more at: https://docs.k3s.io/networking/basic-network-options#custom-cni
  cni:
    type: "flannel"  # flannel | calico | cilium
  loadBalancer:
    # By default, k3s use embedded load balancer with klipper-lb or ServiceLB, which is a simple load balancer for Kubernetes services of type LoadBalancer
    # If you want to use more advanced LB, you can consider disabling and use metalLB, kube-vip
    # Read more at https://docs.k3s.io/networking/networking-services#service-load-balancer
    # Examples:
    # Kube-Vip: https://kube-vip.io/docs/usage/k3s/
    enable: true # false to not setup any service (external) load balancer
    type: "servicelb" # servicelb (klipper-lb) | metallb
    ippool:
      # Only use for metallb, ignore if use kube-vip
      # For using as subnetmask or cidr range format
      cidr: "192.168.56.169 - 192.168.56.254" # Make sure the IP pool is in the same network of K3S nodes
  # Enable Multus CNI for multiple network interfaces in the cluster
  # Read more at: https://docs.k3s.io/networking/multus-ipams
  multus: false
  # If you want to use cloud-provider controller, you can set false for integration
  # Because k3s is providing embeded CCM for ServiceLB
  # Read more at: https://docs.k3s.io/networking/networking-services#deploying-an-external-cloud-controller-manager
  ccm: true
  # By default, k3s use Traefik as Ingress Controller with default settings, you can disable it and use other ingress controller like nginx, cilium or kong
  # Read more at: https://docs.k3s.io/networking/networking-services#traefik-ingress-controller
  # In the situation, you want to custom the traefik ingress, please visit 
  # 1. Github K3s-Chart: https://github.com/k3s-io/k3s-charts/tree/main/charts/traefik
  # 2. Documentation: https://docs.k3s.io/add-ons/helm#customizing-packaged-components-with-helmchartconfig
  # NOTE: Recently, Kubewekend only support Traefik for K3s
  ingress:
    enable: true
    class: "traefik"
    dashboard:
      enable: true
      host: "dashboard.traefik.local"
    gateway:
      enable: true

utilities:
  # Test deployment in the cluster after setup complete
  ingressTestDeployment:
    enable: true
    namespace: "default"
    image: "nginx:latest"
    host: "ingress.local"
    port: 80
    ingressClass: "traefik" # traefik | nginx | cilium | kong
    type: "ClusterIP"
  
  # test deployment settings with API gateway
  apiGatewayTestDeployment:
    enable: true
    namespace: "default"
    gatewayClass: "traefik" # traefik (traefik-gateway) | kong | cilium
    port: 8000 # Port 8000 if traefik service, port 80 for others service like kong, nginx, etc
    host: "apigateway.local"
    path: "/test"

  # Setup Dashboard for the cluster
  dashboard:
    enable: false
    type: "headlamp"  # kubernetes-dashboard | headlamp | rancher
    namespace: "kubernetes-dashboard"
    host: "dashboard.local"
    ingressClass: "nginx"
    createAdminToken: true

  # Storage solutions for the cluster
  # NOTE: Only for K3s clusters, with Kind, use local-path-storage by default
  storage:
    enable: false
    type: "longhorn"  # longhorn | rook-ceph | openebs | glusterfs | nfs-subdir-external-provisioner

  # Driver for CSI (Container Storage Interface) support in the cluster
  # Recommendation: Use for production cluster
  # Reference: https://kubernetes-csi.github.io/docs/introduction.html
  csi:
    nfs: false

  # Certificate Management for the cluster
  # Recommendation: Use for production cluster
  certmanager:
    enable: true
    namespace: "cert-manager"

  # Setup DNS for the cluster for external domain resolution (AWS Route53, Cloudflare, Google Cloud DNS, etc)
  # Recommendation: Use for production cluster
  externalDNS:
    enable: false

  # Secret Management for the cluster
  secretManagement:
    enable: false
    # Options: vault | openbao
    # Recommendation: Use for production cluster
    # NOTE: When you use openbao with latest version, you need to setup Kubernetes Version >= v1.30 for openbao operator compatibility
    # If you use cluster version < v1.30, please use vault as secret management or openbao chart version v0.6.0 (V2.0.2)
    type: "vault" # vault | openbao
    namespace: "vault"
    host: "vault.local"
    ingressClass: "nginx"
    actions:
      init: true # true | false (NOTE: Run only one time at the first setup)
      unseal: "auto"  # auto | manual | none
      savingUnsealKeys: true # Save unseal keys and root token to local file system
    vault:
      operator: true
    openbao:
      ui: true

  # Utilities extensions for the cluster
  extensions:
    enable: false
    # Used to replicate secrets, configmaps and certificates.
    reflector:
      enable: false
    
    # Used to auto reload pods when configmap or secret change
    reloader:
      enable: false

    # Used to sync external secrets from external secret management systems
    externalsecrets:
      enable: false

  # GitOps for the cluster
  gitops:
    enable: false
    type: "flux"  # argocd | flux
    argocd:
      sops: false # Enable SOPS support in ArgoCD for encrypted secrets
      namespace: "argocd"
      host: "argocd.local"
      ingressClass: "nginx"
      argocdImageUpdater: true
      argocdExtensions: true
    flux:
      namespace: "flux-system"
      ui: true # Enable Flux UI (Weave GitOps) or not
      ingressClass: "nginx"
      host: "flux.local"
    kargo:
      enable: true
      namespace: "kargo"
      ingressClass: "nginx"
      host: "kargo.local"

  # Workflow for the cluster
  workflow:
    enable: false
    type: "argo-workflows"  # argo-workflows | tekton

  # Rollout management for the cluster
  rollout:
    enable: false
    type: "argo-rollouts"  # argo-rollouts (compatible with argocd) | flagger (compatible with flux)

  # Setup Controller for Scaling functionality in K8s
  # GitHub: https://github.com/kubernetes/autoscaler
  # Article: https://www.cloudpilot.ai/en/blog/k8s-autoscaling-comparison/
  scaling:
    # Horizontal Pod Autoscaler
    hpa:
      enable: false
      type: "default" # default | keda
    # Vertical Pod Autoscaler
    vpa:
      enable: false
      type: "default" # default | vpa-controller
    # Cluster Autoscaler
    ca:
      enable: false
      type: "default" # default | cluster-autoscaler

  # Setup Monitoring and Observability for the cluster with Prometheus and Grafana Stack with various options
  # Alternative monitoring stacks are also available
  # coroot: https://coroot.com/
  # victoriametrics: https://victoriametrics.com/

  monitoring:
    enable: false
    type: "prometheus-grafana" # prometheus-grafana | coroot | victoriametrics

    # Setup logging for the cluster
    logging:
      enable: false
      type: "loki"  # efk (not include kibana) | loki
    
    # Setup alerting for the cluster
    alert:
      enable: false
      type: "prometheus-alertmanager"  # prometheus-alertmanager | gatus
      oncall: "email"  # email | slack | pagerduty
    # APM for the cluster
    apm:
      enable: false
      type: "jaeger"  # jaeger | zipkin | elastic-apm
    
    # Tracing for the cluster
    tracing:
      enable: false
      type: "opentelemetry"  # opentelemetry | tempo

    # Profiler for the cluster
    profiler:
      enable: false
      type: "pyroscope"  # pyroscope | skywalking

  # Backup and Restore for the cluster
  backupRestore:
    enable: false
    type: "velero"  # velero | trilio

  # Setup service mesh for the cluster
  # Documentation: 
  # Article comparison of service mesh: https://mkdev.me/posts/the-best-service-mesh-linkerd-vs-kuma-vs-istio-vs-consul-connect-comparison-cilium-and-osm-on-top
  serviceMesh:
    enable: false
    type: "istio"  # istio | linkerd | cilium (require cilium CRD)| kong (require kong CRD)

  # Setup security for the cluster
  security:
    policy:
      enable: false
      type: "opa-gatekeeper"  # opa-gatekeeper | kyverno
    rbac:
      enable: false
      type: "rbac-manager"  # rbac-manager | kube-rbac-proxy
    inteligence:
      enable: false
      type: "falco"  # falco | trivy | tetragon
    identity:
      enable: false
      type: "dex"  # dex | keycloak

  # Setup Global Load Balancer for the cluster with k8gb
  # Recommendation: Use for production cluster with multi-cluster setup
  glb:
    enable: false

  # Chaos engineering for the cluster
  chaosEngineering:
    enable: false
    type: "litmus"  # litmus | chaos-mesh

  # Testing and Troubleshooting tools for the cluster
  benchmarking:
    enable: false
    type: "kube-bench"

  # Customize scheduler for the cluster
  scheduler:
    enable: false
    type: "koordinator"  # volcano | descheduler | koordinator

  # Setup IDP (Internal Development Platform) integration for the cluster
  idp:
    enable: false
    type: "backstage"  # backstage | port 

  # Developer tools for the cluster
  developerTools:
    enable: false
    type: "tilt"  # tilt | skaffold

  # Kubernetes Development Environment
  kde:
    enable: false
    type: "devspace"  # devspace | garden.io