kindCluster:
  # Number nodes for the clusters
  # Default is 1 control-plane and 0 worker, you can change the number of nodes for control-plane and worker as you need, 
  # but remember that KIND ALWAYS NEED ONE CONTROL-PLANE TO OPERATE, YOU CAN NOT CREATE ONLY WORKER ON HOST
  numberOfNodes:
    controlPlane: 1
    worker: 0
  networking:
    apiServer:
      address: "127.0.0.1"
      port: 6443
    podSubnet: "10.244.0.0/16"
    serviceSubnet: "10.96.0.0/16"
    # NOTE: only one CNI can be used, and it requires for scheduling pods
    # Supported CNI: calico, flannel, cilium
    disableDefaultCNI: false # Disable default CNI (kindnetd), when set to true, you need to manually setup CNI like calico, flannel, cilium
    cni: "cilium" # calico | flannel | cilium if disableDefaultCNI is true
    kubeProxyMode: "iptables" # iptables | nftables (v1.31+) | ipvs | none
  # Kubernetes version for kind node image, find more at https://hub.docker.com/r/kindest/node/
  # Stable Version (Recommended): v1.28.9, v1.28.15, v1.29.14, v1.30.13, v1.31.14, v1.32.11, v1.33.7, v1.34.3 (latest)  
  image: "kindest/node:v1.34.3"
  loadbalancer:
    enable: true
    type: "cloud-provider-kind"  # metallb | cloud-provider-kind | cilium-ipam-lb (requires cilium CNI)
    ippool:
      # Only use for metallb, ignore if use cloud-provider-kind or cilium-ipam-lb
      # For using as subnetmask or cidr range format (NOTE: same network of docker kind (172.18.0.0/16) bridge with VIP)
      # IF you define another range for kind bridge network, please make sure the ippool is in the same range
      cidr: "172.18.255.2 - 172.18.255.254" 
  ingress:
    enable: true
    class: "traefik"  # nginx | traefik | cilium | kong
  apigateway:
    enable: true
    crd:
      # Install GatewayAPI CRD if not present
      # NOTE: In these situations, you shoudldn't enable this option:
      # 1. CloudProvider Kind Load Balancer Enabled (Already include GatewayAPI CRD)
      # 2. Traefik Ingress Controller Enabled (Already include GatewayAPI CRD)
      install: false
      version: "v1.2.0"  # Install GatewayAPI CRD if not present, versions: v1.2.0 (Compatible with Cilium API Gateway) | v1.4.1 (Latest)
    class: "traefik" # none | kong | cilium | traefik (traefik-gateway)
    # NOTE: This feature is only support for Kong API Gateway
    # Purpose: Setup API Gateway to be internal only (accessible only inside the cluster) combined with LoadBalancer service type
    # Like Other Ingress in situation only one LoadBalancer IP available for multiple Ingress and API Gateway
    kong:
      internalOnly: false # true | false
      admin: false # true | false Enable Kong Admin API Service (for Kong Manager UI and Kong Admin API access)
      ingressClass: "traefik" # IngressClass for Kong API Gateway when internalOnly is true
      internalHostname: "kong-internal.local" # Hostname for Kong API Gateway when internalOnly is true
  # Forward network ports from host to kind cluster and let's you access services from host machine directly by iptables rules
  networkForwarding:
    enable: true

k3sCluster:
  ################### NOTICE ####################################################
  ## This configuration is setup for master node, including
  ## 1. Fix Registration Master
  ## 2. Sever Master Join to cluster for HA cluster setup
  ## Read more at: https://docs.k3s.io/architecture#high-availability-k3s
  ## Server configuration at: https://docs.k3s.io/cli/server
  ###############################################################################

  # Kubernetes version for k3s, find more at https://github.com/k3s-io/k3s/releases
  # Stable Version (Recommended): v1.28.9+k3s1, v1.32.13+k3s1, v1.33.9+k3s1, v1.34.5+k3s1, v1.35.2+k3s1 (latest)
  version: "v1.34.5+k3s1"
  # Number of control-plane nodes, default is 1, and set to 3 for HA Cluster
  # NOTE: For HA Cluster, you need to setup an external database like etcd or postgres, and use external load balancer for control-plane nodes
  # By default, K3s will use etcd when you setup HA cluster with 3 control-plane nodes, and with stanalone embedded SQLite when you setup single control-plane node cluster
  # Read more at: https://docs.k3s.io/architecture#high-availability-k3s
  highAvailability:
    enable: true
    replicas: 3
    # Use dataStorage when you want to setup HA cluster
    # Read more at: ETCD - https://docs.k3s.io/datastore/ha-embedded, Postgres - https://docs.k3s.io/datastore/ha
    dataStorage:
      externalDatabase:
        type: "etcd" # postgres | etcd
        # Only use for postgres, ignore if you use etcd
        host: "127.0.0.1"
        port: 5432
        user: "postgres"
        password: "postgres"
        database: "postgres"
        sslmode: "require" # disable | require | verify-ca | verify-full
    # If you setup HA cluster with multiple control-plane nodes, You can setup the cluster load balancer for ensure the API Server high-availability
    # Read more at: https://docs.k3s.io/datastore/cluster-loadbalancer
    clusterLB:
      enable: false # true if your cluster is set to HA
      type: "HAProxy" # HAProxy | Kube-Vip
  
  # Add additional SANs for the API server certificate, default is "localhost" and "127.0.0.1"
  tlsSANs:
    - "k3s.local"
    - "localhost"
    - "127.0.0.1"
  # Registering and starting kubelet with set of labels
  nodeLabels:
    - "machine-type=cpu"
  # Registering kubelet with set of taints
  nodeTaints: []
  # NOTE: only one CNI can be used, and it requires for scheduling pods
  # Supported CNI: flannel, calico, cilium
  # By default, k3s use flannel as CNI with VXLAN Backend, Read more at: https://docs.k3s.io/networking/basic-network-options?cni=Calico#flannel-options
  # For production cluster, it's recommended to use calico or cilium for better performance and security features
  # Read more at: https://docs.k3s.io/networking/basic-network-options#custom-cni
  cni:
    type: "flannel"  # flannel | calico | cilium
  loadBalancer:
    # By default, k3s use embedded load balancer with klipper-lb or ServiceLB, which is a simple load balancer for Kubernetes services of type LoadBalancer
    # If you want to use more advanced LB, you can consider disabling and use metalLB, kube-vip
    # Read more at https://docs.k3s.io/networking/networking-services#service-load-balancer
    # Examples:
    # Kube-Vip: https://kube-vip.io/docs/usage/k3s/
    enable: true # false to not setup any service (external) load balancer
    type: "servicelb" # servicelb (klipper-lb) | metallb
    ippool:
      # Only use for metallb, ignore if use kube-vip
      # For using as subnetmask or cidr range format
      cidr: "192.168.56.169 - 192.168.56.254" # Make sure the IP pool is in the same network of K3S nodes
  # Enable Multus CNI for multiple network interfaces in the cluster
  # Read more at: https://docs.k3s.io/networking/multus-ipams
  multus: false
  # If you want to use cloud-provider controller, you can set false for integration
  # Because k3s is providing embeded CCM for ServiceLB
  # Read more at: https://docs.k3s.io/networking/networking-services#deploying-an-external-cloud-controller-manager
  ccm: true
  # By default, k3s use Traefik as Ingress Controller with default settings, you can disable it and use other ingress controller like nginx, cilium or kong
  # Read more at: https://docs.k3s.io/networking/networking-services#traefik-ingress-controller
  # In the situation, you want to custom the traefik ingress, please visit 
  # 1. Github K3s-Chart: https://github.com/k3s-io/k3s-charts/tree/main/charts/traefik
  # 2. Documentation: https://docs.k3s.io/add-ons/helm#customizing-packaged-components-with-helmchartconfig
  # NOTE: Recently, Kubewekend only support Traefik for K3s
  ingress:
    enable: true
    class: "traefik"
    dashboard:
      enable: true
      host: "dashboard.traefik.local"
    gateway:
      enable: true

utilities:
  # Test deployment in the cluster after setup complete
  ingressTestDeployment:
    enable: true
    namespace: "default"
    image: "nginx:latest"
    host: "ingress.local"
    port: 80
    ingressClass: "traefik" # traefik | nginx | cilium | kong
    type: "ClusterIP"
  
  # test deployment settings with API gateway
  apiGatewayTestDeployment:
    enable: true
    namespace: "default"
    gatewayClass: "traefik" # traefik (traefik-gateway) | kong | cilium
    port: 8000 # Port 8000 if traefik service, port 80 for others service like kong, nginx, etc
    host: "apigateway.local"
    path: "/test"

  # Setup Dashboard for the cluster
  dashboard:
    enable: false
    type: "headlamp"  # kubernetes-dashboard | headlamp | rancher
    namespace: "kubernetes-dashboard"
    host: "dashboard.local"
    ingressClass: "nginx"
    createAdminToken: true

  # Storage solutions for the cluster
  # NOTE: Only for K3s clusters, with Kind, use local-path-storage by default
  storage:
    enable: true
    # Explore Longhorn for production: https://longhorn.io/
    type: "longhorn"  # longhorn
    namespace: "longhorn"
    setup:
      iscsi: true # Enable iSCSI support for Longhorn, which is required for some features like backup and restore, and also for better performance in some cases
      nfs: false # Enable NFS support for Longhorn, which is required for some features like backup and restore, and also for better performance in some cases
    # Driver for CSI (Container Storage Interface) support in the cluster
    # Recommendation: Use for production cluster
    # Reference: https://kubernetes-csi.github.io/docs/introduction.html
    csi:
      # NFS CSI Driver: https://github.com/kubernetes-sigs/nfs-subdir-external-provisioner
      nfs: false

  # Object Storage
  objectStorage:
    enable: false
    # Explore Production-ready for object storage with
    # 1. SeaweedFS: https://github.com/seaweedfs/seaweedfs
    # 2. Garage: https://garagehq.deuxfleurs.fr/
    # 3. MinIO: https://min.io/ (Recommended for production cluster)
    # Other solutions: rustfs (https://github.com/rustfs/rustfs), (cubefs) https://github.com/cubefs/cubefs
    type: "seaweedfs"  # seaweedfs | garage | minio
    namespace: "seaweedfs"
    host: "seaweedfs.local"
    ingressClass: "traefik"

  # Certificate Management for the cluster with ACME and Let's Encrypt for automated certificate issuance and renewal
  # Explore more at: https://cert-manager.io/
  # Recommendation: Use for production cluster
  certmanager:
    enable: true
    namespace: "cert-manager"

  # Setup DNS for the cluster for external domain resolution (AWS Route53, Cloudflare, Google Cloud DNS, etc)
  # Explore more at: https://github.com/kubernetes-sigs/external-dns
  # Recommendation: Use for production cluster
  dns:
    enable: true
    type: "external-dns"  # external-dns (with cloud provider DNS like AWS Route53, Cloudflare, etc)

  # Setup Global Load Balancer for the cluster with k8gb, Explore more at: https://github.com/k8gb-io/k8gb
  # Recommendation: Use for production cluster with multi-cluster setup, automatic failover and global traffic management requirements
  glb:
    enable: false
    type: "k8gb"  # k8gb

  # Secret Management for the cluster
  secretManagement:
    enable: true
    # Options: vault | openbao
    # Recommendation: Use for production cluster
    # NOTE: When you use openbao with latest version, you need to setup Kubernetes Version >= v1.30 for openbao operator compatibility
    # If you use cluster version < v1.30, please use vault as secret management or openbao chart version v0.6.0 (V2.0.2)
    type: "vault" # vault | openbao
    namespace: "vault"
    host: "vault.local"
    ingressClass: "traefik"
    actions:
      init: true # true | false (NOTE: Run only one time at the first setup)
      unseal: "auto"  # auto | manual | none
      savingUnsealKeys: true # Save unseal keys and root token to local file system
    vault:
      operator: true
    openbao:
      ui: true

  # Utilities extensions for the cluster
  extensions:
    enable: false
    # Used to replicate secrets, configmaps and certificates.
    # GitHub: https://github.com/emberstack/kubernetes-reflector
    reflector:
      enable: false
    
    # Used to auto reload pods when configmap or secret change
    # GitHub: https://github.com/stakater/reloader
    reloader:
      enable: false

    # Used to sync external secrets from external secret management systems
    # https://github.com/external-secrets/external-secrets
    externalsecrets:
      enable: false

    # A Kubernetes controller and tool for one-way encrypted Secrets
    # GitHub: https://github.com/bitnami-labs/sealed-secrets
    sealedsecrets:
      enable: false

    # A Database Operator for Schema Management and Migrations in Kubernetes
    # GitHub: https://schemahero.io/
    schemahero:
      enable: false

  # Operator for cluster management and automation, with various options for different use cases and requirements
  # E.g: Database (PostgreSQL, MongoDB), Messaging (RabbitMQ, Kafka), Cache (Redis, Memcached), etc
  # Read more about Kubernetes Operators at: https://kubernetes.io/docs/concepts/extend-kubernetes/operator/
  # Find more at: https://operatorhub.io/ or https://artifacthub.io/packages/search?org=operator-framework&sort=relevance&page=1
  # If you want to any helm-chart, I also recommend using Bitami's Helm with multiple references, at: https://artifacthub.io/packages/search?repo=bitnami&sort=relevance&page=1
  operator:
    enable: false
    # Full operation for database with 35+ operators available with Kubeblocks
    # Explore more at: https://kubeblocks.io/
    full:
      enable: false
      type: "kubeblocks"
    # Operators for deploying and managing stateful applications for PostgreSQL
    # Explore more at:
    # 1. CloudNativePG (CNPG): https://cloudnative-pg.io/ (Recommended)
    # 2. Percona PostgreSQL Operator: https://docs.percona.com/percona-operator-for-postgresql/2.9.0/index.html
    postgresql:
      enable: false
      type: "cnpg" # cnpg (CloudNativePG) | percona (Percona PostgreSQL Operator)
    # Operators for deploying and managing stateful applications for MongoDB
    # Explore more at:
    # 1. MongoDB Community Operator: https://github.com/mongodb/mongodb-kubernetes
    # 2. Percona MongoDB Operator: https://docs.percona.com/percona-operator-for-mongodb/index.html
    mongodb:
      enable: false
      type: "community"  # community (MongoDB Community Operator) | percona (Percona MongoDB Operator)
    # Operators for deploying and managing stateful applications for Elasticsearch and OpenSearch
    # Explore more at:
    # 1. ECK (Elastic Cloud on Kubernetes): https://operatorhub.io/operator/elastic-cloud-eck
    # 2. OpenSearch Operator: https://github.com/opensearch-project/opensearch-k8s-operator
    search:
      enable: false
      type: "elasticsearch"  # elasticsearch | opensearch
    # Operators for deploying and managing stateful applications for Messaging, including RabbitMQ and Kafka
    # Explore more at:
    # 1. RabbitMQ: https://github.com/rabbitmq/cluster-operator
    # 2. Kafka (Strimzi): https://github.com/strimzi/strimzi-kafka-operator
    messaging:
      enable: false
      type: "rabbitmq"  # rabbitmq (Recommended))
    kafka:
      enable: false
      type: "strimzi"  # strimzi (Recommended)
    # Operators for deploying and managing stateful applications for Cache, including Redis and Memcached
    # Explore more at:
    # 1. Redis Operator: https://github.com/ot-container-kit/redis-operator
    # 2. Memcached: https://artifacthub.io/packages/helm/bitnami/memcached
    # 3. Valkey Operator: https://artifacthub.io/packages/helm/bitnami/valkey
    cache:
      enable: false
      type: "redis"  # redis | memcached | valkey

  # GitOps for the cluster
  # 1. ArgoCD: https://argo-cd.readthedocs.io/en/stable/ (Recommended)
  # 2. Flux: https://fluxcd.io/ (Recommended)
  gitops:
    enable: true
    type: "argocd"  # argocd | flux
    argocd:
      namespace: "argocd"
      host: "argocd.local"
      ingressClass: "traefik"
      # Using argocd-image-updater: https://argocd-image-updater.readthedocs.io/en/stable/
      argocdImageUpdater: true
      # Extensions for ArgoCD, include
      # 1. argocd-extension-metrics: https://github.com/argoproj-labs/argocd-extension-metrics
      # 2. argocd-rollout-extension: https://github.com/argoproj-labs/rollout-extension
      argocdExtensions: true
      # Using argocd-vault-plugin: https://github.com/argoproj-labs/argocd-vault-plugin
      argocdSecretManagement: true
    flux:
      namespace: "flux-system"
      # Enable Flux UI (Weave GitOps), explore more at: https://github.com/weaveworks/weave-gitops
      ui: true
      ingressClass: "traefik"
      host: "flux.local"
    # Multi-stage GitOps Continuous promotion
    # Read more at: https://kargo.io/
    kargo:
      enable: false
      namespace: "kargo"
      ingressClass: "traefik"
      host: "kargo.local"

  # Setup security for the cluster with various options for policy, RBAC, intelligence and identity management
  # Read more about Kubernetes Security at
  # 1. Best Practices and Techniques: https://medium.com/@josephsims1/enhancing-kubernetes-security-best-practices-and-techniques-c7eb2540f59b
  # 2. Kubernetes Security: https://kubernetes.io/docs/concepts/security/
  # 3. Kubernetes Security (Book): https://ioannisgk.com/wp-content/uploads/2023/12/Kubernetes-Security-and-Observability.pdf
  # 4. OWASP Kubernetes Security: https://cheatsheetseries.owasp.org/cheatsheets/Kubernetes_Security_Cheat_Sheet.html
  # 5. Kubernetes Security Tools: https://www.wiz.io/academy/container-security/top-kubernetes-security-tools
  security:
    enable: true
    policyEngine:
      enable: true
      type: "kyverno"  # opa-gatekeeper | kyverno
      namespace: "kyverno" # `kyverno` required for kyverno, opa-gatewaykeepers able to run in any namespace, but recommend `gatekeeper-system`
    # For Kubernetes Authentication and more about strategy to manage Identity in application
    # via OAuth Middleware
    # Read more at: https://www.tremolo.io/post/kubernetes-authentication-comparing-solutions
    # About Dex case study: https://b-nova.com/en/home/content/dex-the-game-changer-in-app-authentication-see-how-it-works/
    identity:
      enable: true
      type: "dex"  # dex
      namespace: "dex"
      host: "dex.local"
      ingressClass: "traefik"
    # For Kubernetes Security Intelligence and Runtime Security, including 
    # tools for vulnerability scanning, runtime security, and intrusion detection
    # Read more at: 
    # 1. Kubernetes Runtime Security: https://www.sysdig.com/learn-cloud-native/what-is-runtime-security-in-kubernetes
    # 2. Best Open-Source Kubernetes Security Tools: https://www.armosec.io/blog/best-open-source-kubernetes-security-tools/
    # 3. Falco vs. Tetragon: https://medium.com/@mughal.asim/falco-vs-tetragon-a-runtime-security-showdown-for-kubernetes-a0e9fb9f30a0
    # 4. Falco, Tetragon, KubeArmor, or Tracee? Choosing the Right Security Agent: https://www.youtube.com/watch?v=2FcOeTfmU3M
    intelligence:
      enable: false
      type: "falco"  # falco | tetragon

  # Setup Monitoring and Observability for the cluster with Prometheus and Grafana Stack with various options
  # Explore more at: https://prometheus-operator.dev/ or https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
  # Alternative monitoring stacks are also available: coroot (https://coroot.com/) or victoriametrics (https://victoriametrics.com/)
  #####################################################################################################
  # To focus on setup fully funnctional monitoring stack, Kubewekend only support LGTM Stack, including:
  # L (Logging): Loki; G (Visualization): Grafana; T (Tracing): Tempo; M (Metrics): Mimir
  # Read more about LGTM Stack at: 
  # 1. https://github.com/daviaraujocc/lgtm-stack
  # 2. https://drdroid.io/engineering-tools/lgtm-stack-for-observability-a-complete-guide
  # 3. https://github.com/saidsef/grafana-loki-on-k8s
  # 4. https://blog.tarazevits.io/a-deep-dive-into-my-self-hosted-grafana-lgtm-stack/
  # 5. https://hackmd.io/@XeusNguyen/rJk0lunAj
  # 6. https://oneuptime.com/blog/post/2026-01-21-loki-tempo-traces-correlation/view
  monitoring:
    enable: true
    type: "kube-prometheus-stack" # kube-prometheus-stack (Prometheus + Grafana)
    namespace: "monitoring"
    config:
      # Prometheus
      prometheus:
        enable: true
        storageClassName: "longhorn"
        size: "5Gi"
      # Grafana
      grafana:
        enable: true
        ingress:
          enable: true
          ingressClass: "traefik"
          host: "grafana.local"
        persistence:
          enable: true
          storageClassName: "longhorn"
          size: "1Gi"
        # Enable Grafana Operator for better management of Grafana instances and dashboards
        operator: false
      # Prometheus Scraping
      scraping:
        enable: true # Enable all scraping for the cluster
        kubeApiServer: true
        kubelet: true
        kubeControllerManager: true
        coreDns: true # Either coreDns or kubeDns enabled
        kubeDns: true
        kubeEtcd: true
        kubeScheduler: false
        kubeProxy: false

    # APM for the cluster as Observability agent collector for Metrics, Logs, Traces and several stuff of Application
    apm:
      enable: true
      type: "alloy" # alloy (compatible with OpenTelemetry Collector)
      namespace: "monitoring"
      config:
        clusterName: "kubeweekend" # Cluster name for labeling and identification in monitoring and observability tools
        collected:
          logs:
            enable: true
          traces:
            enable: true
          profiles:
            enable: false
            # NOTE: eBPF require privileged SecurityContext for Alloy container to run with root permissions, 
            # and also specific PID to collect host-level profiling data
            # For normal usage, it's recommended to use "scrape" mode, but for complex analysis the leaking or performance issue 
            # in the cluster, you can use "ebpf" mode for better visibility into the cluster performance and behavior
            pyroscope: "scrape" # scrape | ebpf 

    # Setup logging for the cluster
    # Alternative logging solutions are also available Fluentd/FluentBit, Filebeat, ELK, EFK, ...
    logging:
      enable: true
      type: "loki"  # loki
      namespace: "monitoring"
      config:
        # With Alloy APM as collector, you can change the promtail legacy to alloy for better integration
        # But Loki also able to collect logs with promtail, fluentbit, fluentd, filebeat, etc
        collector:
          enable: false
          type: "promtail" # promtail | fluentbit
        deploymentMode: "SingleBinary"
        msgSize:
          server:
            recv: 41943040 # 40MB (In bytes)
            send: 41943040 # 40MB (In bytes)
          client:
            recv: 104857600 # 100MB (In bytes)
            send: 104857600 # 100MB (In bytes)
        auth_enabled: false
        # Loki require object storage for storaging chunks and rulers
        # but for testing purpose, you can use local storage with emptyDir or hostPath, 
        # but it's not recommended for production cluster
        storage:
          type: "filesystem" # filesystem
          persistence:
            enable: true
            storageClassName: "longhorn"
            size: "5Gi"
        # Enable tracing for Loki, which is useful for debugging and performance analysis of Loki itself, 
        # and also for better integration with Tempo and other tracing solutions in the cluster
        tracing: true
        # Enable pattern_ingester
        pattern_ingester: false
        # ruler
        ruler:
          enable: false
          persistence:
            enable: true
            storageClassName: "longhorn"
            size: "1Gi"
    
    # Setup alerting/On-call for the cluster
    # Alternative alerting like Gatus (https://github.com/TwiN/gatus)
    alertmanager:
      enable: true
      config:
        notification: "slack" # slack | email
        oncall:
          enable: false
          type: "pagerduty"  # pagerduty
        persistence:
          storageClassName: "longhorn"
          size: "1Gi"
    
    # Tracing for the cluster
    # Alternative solutions are also available OpenTelemetry Collector with various exporters (Jaeger, Zipkin, etc)
    # Explore more about Tempo Link with Log and Profile in Grafana
    # Traces in Explore: https://grafana.com/docs/grafana/latest/visualizations/explore/trace-integration/
    # Traces to Profiles: https://grafana.com/docs/pyroscope/latest/configure-client/trace-span-profiles/
    # Traces to Logs: https://grafana.com/docs/grafana/latest/datasources/tempo/configure-tempo-data-source/#trace-to-logs
    # Traces to Metrics: https://grafana.com/docs/grafana/latest/datasources/tempo/configure-tempo-data-source/#trace-to-metrics
    tracing:
      enable: true
      type: "tempo" # tempo
      namespace: "monitoring"
      config:
        persistence:
          enable: true
          storageClassName: "longhorn"
          size: "5Gi"
        msgSize:
          server:
            recv: 16777216 # 16MB (In bytes)
            send: 16777216 # 16MB (In bytes)

    # Profiling for the cluster
    # Alternative solutions are also available skywalking (https://skywalking.apache.org/))
    profiling:
      enable: true
      type: "pyroscope"  # pyroscope
      namespace: "monitoring"
      config:
        persistence:
          enable: true
          storageClassName: "longhorn"
          size: "5Gi"

  # Setup service mesh for the cluster, with various options for different use cases and requirements
  # Note: Kubewekend only support Istio for service mesh setup
  # Alternative service mesh solutions are also available Linkerd, Cilium Service Mesh, Kong Mesh, Open Service Mesh (OSM), etc
  # Read more about article comparison between service mesh
  # https://mkdev.me/posts/the-best-service-mesh-linkerd-vs-kuma-vs-istio-vs-consul-connect-comparison-cilium-and-osm-on-top
  serviceMesh:
    enable: true
    type: "istio"  # istio

  # Setup IDP (Internal Development Platform) integration for the cluster
  # An Internal Developer Platform (IDP) is built by a platform team to build golden paths and enable developer self-service
  # Read more at: https://internaldeveloperplatform.org/what-is-an-internal-developer-platform/
  # Youtube Video and Trend:
  # 1. What is an Internal Developer Platform? - https://www.youtube.com/watch?v=w7hPRaPIKlU
  # 2. Internal Developer Platform (IDP) - https://www.youtube.com/playlist?list=PLyicRj904Z9_50dH2eD5prLZ8b9A-fdgt
  idp:
    enable: true
    # Portal for the cluster, which is the entry point for developers to access the cluster and its resources,
    # and also provide features like application catalog, developer dashboard, etc
    # Read more at: https://internaldeveloperplatform.org/developer-portals/
    # Open-source options: Backstage (https://backstage.io/) or explore at: https://backstage.io/docs/overview/what-is-backstage
    portal:
      enable: true
      type: "backstage"  # backstage
      namespace: "backstage"
      host: "backstage.local"
      ingressClass: "traefik"
    # Platform Orchestrators are the center piece of any Internal Developer Platform. A Platform Orchestrator enables Dynamic Configuration Management
    # Read more at: https://internaldeveloperplatform.org/platform-orchestrators/
    # Open-source options: KusionStack (https://kusionstack.io/), Humanitec (https://humanitec.com/)
    orchestrator:
      enable: false
    # Security plane for the cluster
    # Read more at: https://internaldeveloperplatform.org/security/
    # Open-source options: Snyk (https://snyk.io/), Falco (https://falco.org/), Trivy (https://github.com/aquasecurity/trivy)
    security:
      enable: false
    # Database for the cluster, used for IDP and other components in the cluster
    # Read more at: https://internaldeveloperplatform.org/databases/
    # Open-source options: Aiven (https://aiven.io/), CloudnativePG (https://cloudnative-pg.io/)
    database:
      enable: false

  # Setup Controller for Scaling functionality in K8s
  # GitHub: https://github.com/kubernetes/autoscaler
  # Article: https://www.cloudpilot.ai/en/blog/k8s-autoscaling-comparison/
  scaling:
    # Horizontal Pod Autoscaler
    # Default Kubernetes HPA: https://kubernetes.io/docs/concepts/workloads/autoscaling/horizontal-pod-autoscale/
    hpa:
      enable: false
      type: "keda" # keda | karpenter
    # Vertical Pod Autoscaler
    # Default Kubernetes VPA: https://kubernetes.io/docs/concepts/workloads/autoscaling/vertical-pod-autoscale/
    vpa:
      enable: false
      type: "default" # default | vpa-controller
    # Cluster Autoscaler (Support for cloud provider autoscaler and cluster-autoscaler)
    # Node Autoscaler: https://kubernetes.io/docs/concepts/cluster-administration/node-autoscaling/
    ca:
      enable: false
      type: "default" # default | cluster-autoscaler

  # Developer tools and environment for Developers in the cluster, including tools for local development, debugging, testing, and 
  # more to enhance the developer experience and productivity
  DevEx:
    enable: false
    # Kubernetes Development Environment (KDE)
    kde:
      enable: false
      type: "okteto"  # devspace | okteto | garden | devpod
    # Kubernetes Development Tools (KDT)
    kdt:
      enable: false
      type: "mirrord"  # tilt | skaffold | mirrord

  # Backup and Restore for the cluster
  backupRestore:
    enable: false
    type: "velero"  # velero | trilio

  # Chaos engineering for the cluster
  chaosEngineering:
    enable: false
    type: "litmus"  # litmus | chaos-mesh

  # Testing and Troubleshooting tools for the cluster
  benchmarking:
    enable: false
    type: "kube-bench"

  # Customize scheduler for the cluster
  scheduler:
    enable: false
    type: "koordinator"  # volcano | descheduler | koordinator

  # Workflow for the cluster
  workflow:
    enable: false
    type: "argo-workflows"  # argo-workflows | tekton

  # Rollout management for the cluster
  rollout:
    enable: false
    type: "argo-rollouts"  # argo-rollouts (compatible with argocd) | flagger (compatible with flux)

  # GPU Support for the cluster
  gpu:
    enable: false
    type: "gpu-operator"  # gpu-operator | HAMi | vgpu-device-manager | KAI Scheduler