          when: utilities.monitoring.config.grafana.operator | default(false)

        - name: "Copy template for Alloy APM values.yaml to remote host"
          when: utilities.monitoring.apm.enable | default(false)
          ansible.builtin.template:
            src: "alloy-values.yaml.j2"
            dest: "/home/{{ user }}/alloy-values.yaml"
            mode: "0644"
          changed_when: false
          register: alloy_apm_values_result

        - name: "Setup APM with Alloy for the cluster"
          when: utilities.monitoring.apm.enable | default(false)
          ansible.builtin.shell: |
            helm repo add grafana https://grafana.github.io/helm-charts
            helm repo update
            helm upgrade --install alloy grafana/alloy \
              --namespace {{ utilities.monitoring.apm.namespace }} --create-namespace --version 1.7.0 --wait \
              -f /home/{{ user }}/alloy-values.yaml
          changed_when: false
          register: alloy_apm_result

        - name: "Display APM with Alloy result"
          ansible.builtin.debug:
            msg: "{{ alloy_apm_result.stdout_lines }}"
          changed_when: false
          when: utilities.monitoring.apm.enable | default(false)

        - name: "Copy template for Loki values.yaml to remote host"
          when: utilities.monitoring.logging.enable | default(false)
          ansible.builtin.template:
            src: "loki-values.yaml.j2"
            dest: "/home/{{ user }}/loki-values.yaml"
            mode: "0644"
          changed_when: false
          register: loki_log_management_values_result

        - name: "Setup Log Management with Loki for the cluster"
          when: utilities.monitoring.logging.enable | default(false)
          ansible.builtin.shell: |
            helm repo add grafana-community https://grafana-community.github.io/helm-charts
            helm repo update
            helm upgrade --install loki grafana-community/loki \
              --namespace {{ utilities.monitoring.logging.namespace }} --create-namespace --version 9.5.1 --wait \
              -f /home/{{ user }}/loki-values.yaml
          changed_when: false
          register: loki_log_management_result

        - name: "Display Log Management with Loki result"
          ansible.builtin.debug:
            msg: "{{ loki_log_management_result.stdout_lines }}"
          changed_when: false
          when: utilities.monitoring.logging.enable | default(false)

        - name: "Copy template for Tempo values.yaml to remote host"
          when: utilities.monitoring.tracing.enable | default(false)
          ansible.builtin.template:
            src: "tempo-values.yaml.j2"
            dest: "/home/{{ user }}/tempo-values.yaml"
            mode: "0644"
          changed_when: false
          register: tempo_tracing_values_result

        - name: "Setup Tracing with Tempo for the cluster"
          when: utilities.monitoring.tracing.enable | default(false)
          ansible.builtin.shell: |
            helm repo add grafana-community https://grafana-community.github.io/helm-charts
            helm repo update
            helm upgrade --install tempo grafana-community/tempo \
              --namespace {{ utilities.monitoring.tracing.namespace }} --create-namespace --version 1.26.7 --wait \
              -f /home/{{ user }}/tempo-values.yaml
          changed_when: false
          register: tempo_tracing_result

        - name: "Display Tracing with Tempo result"
          ansible.builtin.debug:
            msg: "{{ tempo_tracing_result.stdout_lines }}"
