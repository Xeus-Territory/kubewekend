        - name: "Copy template for Pyroscope values.yaml to remote host"
          when: utilities.monitoring.profiling.enable | default(false)
          ansible.builtin.template:
            src: "pyroscope-values.yaml.j2"
            dest: "/home/{{ user }}/pyroscope-values.yaml"
            mode: "0644"
          changed_when: false
          register: pyroscope_profiling_values_result

        - name: "Setup Profiling with Pyroscope for the cluster"
          when: utilities.monitoring.profiling.enable | default(false)
          ansible.builtin.shell: |
            helm repo add grafana https://grafana.github.io/helm-charts
            helm repo update
            helm upgrade --install pyroscope grafana/pyroscope \
              --namespace {{ utilities.monitoring.profiling.namespace }} --create-namespace --version 1.19.2 --wait \
              -f /home/{{ user }}/pyroscope-values.yaml
          changed_when: false
          register: pyroscope_profiling_result

        - name: "Display Profiling with Pyroscope result"
          ansible.builtin.debug:
            msg: "{{ pyroscope_profiling_result.stdout_lines }}"
