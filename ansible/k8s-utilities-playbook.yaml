            helm repo update
            helm upgrade --install tempo grafana-community/tempo \
              --namespace {{ utilities.monitoring.tracing.namespace }} --create-namespace --version 1.26.7 --wait \
              -f /home/{{ user }}/tempo-values.yaml
          changed_when: false
          register: tempo_tracing_result

        - name: "Display Tracing with Tempo result"
          ansible.builtin.debug:
            msg: "{{ tempo_tracing_result.stdout_lines }}"
          changed_when: false
          when: utilities.monitoring.tracing.enable | default(false)

        - name: "Copy template for Pyroscope values.yaml to remote host"
          when: utilities.monitoring.profiling.enable | default(false)
          ansible.builtin.template:
            src: "pyroscope-values.yaml.j2"
            dest: "/home/{{ user }}/pyroscope-values.yaml"
            mode: "0644"
          changed_when: false
          register: pyroscope_profiling_values_result

