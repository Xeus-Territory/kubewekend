---
- name: "Kubernetes Cluster Utilities Playbook"
  vars:
    cluster_name: "{{ host_name }}"
    user: "{{ ansible_user_id }}"
  # To fix lint issues: when you not set host_name, use default func of jinja2 to handle
  # https://stackoverflow.com/questions/35105615/use-a-default-if-a-variable-is-not-defined
  hosts: "{{ host_name | default('sample-k8s-master') }}"
  tasks:
      # Task help choose var_files when host is master
    - name: Access master var_files
      tags: always
      # Use `include_vars` to handling to task to import
      # host_vars base on conditional
      # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/include_vars_module.html
      ansible.builtin.include_vars:
        file: "./inventories/host_vars/master.yaml"
      # `when` conditional inside the ansible which help handle configuration,
      # and give the flexible to dynamic tasks on ansible
      # https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_conditionals.html
      when: cluster_name is search("master")

    - name: "Ingress test deployment in side the cluster"
      tags: ingress_test
      when: utilities.ingressTestDeployment.enable | default(false)
      block:
        # Copy test deployment template to remote host
        - name: "Create test deployment template on remote host"
          ansible.builtin.template:
            src: "ingress-test-deployment.yaml.j2"
            dest: "/home/{{ user }}/ingress-test-deployment.yaml"
            mode: "0644"
          changed_when: false

        - name: "Create test deployment, service and ingress"
          ansible.builtin.shell: |
            kubectl apply -n {{ utilities.ingressTestDeployment.namespace }} -f /home/{{ user }}/ingress-test-deployment.yaml
          changed_when: false
          register: test_deployment_result

        - name: "Display test deployment result"
          ansible.builtin.debug:
            msg: "{{ test_deployment_result.stdout_lines }}"
          changed_when: false

    - name: "API Gateway test deployment in side the cluster"
      tags: apigateway_test
      when: utilities.apiGatewayTestDeployment.enable | default(false)
      block:
        # Copy API gateway test deployment template to remote host
        - name: "Create API gateway test deployment template on remote host"
          ansible.builtin.template:
            src: "apigateway-test-deployment.yaml.j2"
            dest: "/home/{{ user }}/apigateway-test-deployment.yaml"
            mode: "0644"
          changed_when: false

        - name: "Create API gateway test deployment, service, gateway and httproute"
          ansible.builtin.shell: |
            kubectl apply -n {{ utilities.apiGatewayTestDeployment.namespace }} -f /home/{{ user }}/apigateway-test-deployment.yaml
          changed_when: false
          register: apigateway_test_deployment_result

        - name: "Display API gateway test deployment result"
          ansible.builtin.debug:
            msg: "{{ apigateway_test_deployment_result.stdout_lines }}"
          changed_when: false

    - name: "Setup cert-manager for the cluster"
      tags: certmanager
      when: utilities.certmanager.enable | default(false)
      block:
        - name: "Install cert-manager CRDs"
          ansible.builtin.shell: |
            helm repo add jetstack https://charts.jetstack.io
            helm repo update
            helm upgrade --install cert-manager jetstack/cert-manager \
              --namespace cert-manager --create-namespace --version v1.19.2 --wait \
              --set crds.enabled=true
          changed_when: false
          register: certmanager_install_result

        - name: "Display cert-manager installation result"
          ansible.builtin.debug:
            msg: "{{ certmanager_install_result.stdout_lines }}"
          changed_when: false

        - name: "Setup Self-Signed Certificates for the cluster with Cert Manager"
          when: utilities.certmanager.selfSignedIssuer.enable | default(false)
          ansible.builtin.shell: |
            cat <<EOF | kubectl apply -f -
            apiVersion: cert-manager.io/v1
            kind: ClusterIssuer
            metadata:
              name: selfsigned-{{ utilities.certmanager.selfSignedIssuer.name }}
            spec:
              selfSigned: {}
            ---
            apiVersion: cert-manager.io/v1
            kind: Certificate
            metadata:
              name: {{ utilities.certmanager.selfSignedIssuer.name }}-selfsigned-ca
              # Create CA root secret in `cert-manager` namespace instead of `sandbox` namespace.
              namespace: cert-manager
            spec:
              isCA: true
              commonName: {{ utilities.certmanager.selfSignedIssuer.name }}-selfsigned-ca
              secretName: {{ utilities.certmanager.selfSignedIssuer.secretName }}
              privateKey:
                algorithm: ECDSA
                size: 256
              issuerRef:
                name: selfsigned-{{ utilities.certmanager.selfSignedIssuer.name }}
                kind: ClusterIssuer
                group: cert-manager.io
            ---
            apiVersion: cert-manager.io/v1
            kind: ClusterIssuer
            metadata:
              name: {{ utilities.certmanager.selfSignedIssuer.name }}-ca-issuer
            spec:
              ca:
                # `ClusterIssuer` resource is not namespaced, so `secretName` is assumed to reference secret in `cert-manager` namespace.
                secretName: {{ utilities.certmanager.selfSignedIssuer.secretName }}
            EOF
          changed_when: false
          register: certmanager_selfsigned_issuer_result

        - name: "Display cert-manager Self-Signed Issuer setup result"
          ansible.builtin.debug:
            msg: "{{ certmanager_selfsigned_issuer_result.stdout_lines }}"
          changed_when: false
          when: utilities.certmanager.selfSignedIssuer.enable | default(false)

        - name: Get the root CA certificate from remote host
          when: utilities.certmanager.selfSignedIssuer.enable | default(false)
          ansible.builtin.shell: |
            sleep 5 # Wait for the certificate to be generated
            kubectl -n cert-manager get secret {{ utilities.certmanager.selfSignedIssuer.secretName }} -o jsonpath='{.data.ca\.crt}' | base64 --decode > /home/{{ user }}/{{ utilities.certmanager.selfSignedIssuer.name }}-ca.crt
            echo "Root CA certificate has been saved to /home/{{ user }}/{{ utilities.certmanager.selfSignedIssuer.name }}-ca.crt"
          changed_when: false
          register: certmanager_get_root_ca_result
        
        - name: "Display cert-manager Get Root CA result"
          ansible.builtin.debug:
            msg: "{{ certmanager_get_root_ca_result.stdout_lines }}"
          changed_when: false
          when: utilities.certmanager.selfSignedIssuer.enable | default(false)

        - name: "Copy root CA certificate from remote"
          ansible.builtin.fetch:
            src: "/home/{{ user }}/{{ utilities.certmanager.selfSignedIssuer.name }}-ca.crt"
            dest: "./{{ utilities.certmanager.selfSignedIssuer.name }}-ca.crt"
            flat: yes
          changed_when: false
          when: utilities.certmanager.selfSignedIssuer.enable | default(false)

    - name: "Setup Dashboard for the cluster"
      tags: dashboard
      when: utilities.dashboard.enable | default(false)
      block:
        # Documentation (Deprecated): https://github.com/kubernetes/dashboard
        - name: "Setup Kubernetes Dashboard"
          when: utilities.dashboard.type == "kubernetes-dashboard"
          ansible.builtin.shell: |
            helm repo add kubernetes-dashboard https://kubernetes.github.io/dashboard/
            helm repo update
            helm upgrade --install kubernetes-dashboard kubernetes-dashboard/kubernetes-dashboard \
              --namespace {{ utilities.dashboard.namespace }} --create-namespace --version 7.14.0 --wait \
              --set app.ingress.enabled=true \
              --set app.ingress.hosts[0]={{ utilities.dashboard.host }} \
              --set app.ingress.ingressClassName={{ utilities.dashboard.ingressClass }}
          changed_when: false
          register: kubernetes_dashboard_result

        - name: "Display Kubernetes Dashboard result"
          ansible.builtin.debug:
            msg: "{{ kubernetes_dashboard_result.stdout_lines }}"
          changed_when: false
          when: utilities.dashboard.type == "kubernetes-dashboard"

        - name: "Setup Kubernetes Headlamp Dashboard"
          when: utilities.dashboard.type == "headlamp"
          ansible.builtin.shell: |
            helm repo add headlamp https://kubernetes-sigs.github.io/headlamp/
            helm repo update
            helm upgrade --install headlamp headlamp/headlamp \
              --namespace {{ utilities.dashboard.namespace }} --create-namespace --version 0.39.0 --wait \
              --set ingress.enabled=true \
              --set ingress.ingressClassName={{ utilities.dashboard.ingressClass }} \
              --set ingress.hosts[0].host={{ utilities.dashboard.host }} \
              --set ingress.hosts[0].paths[0].path=/ \
              --set ingress.hosts[0].paths[0].type="ImplementationSpecific"

          changed_when: false
          register: headlamp_dashboard_result

        - name: "Display Kubernetes Headlamp Dashboard result"
          ansible.builtin.debug:
            msg: "{{ headlamp_dashboard_result.stdout_lines }}"
          changed_when: false
          when: utilities.dashboard.type == "headlamp"

        - name: "Setup Kubernetes Dashboard Admin Token"
          when: utilities.dashboard.type == "kubernetes-dashboard" and utilities.dashboard.createAdminToken | default(false)
          ansible.builtin.shell: |
            kubectl -n {{ utilities.dashboard.namespace }} create serviceaccount admin-user
            kubectl -n {{ utilities.dashboard.namespace }} create clusterrolebinding admin-user \
              --clusterrole=cluster-admin --serviceaccount={{ utilities.dashboard.namespace }}:admin-user
            kubectl -n {{ utilities.dashboard.namespace }} create token admin-user
          changed_when: false
          register: kubernetes_dashboard_admin_token

        - name: "Display Kubernetes Dashboard Admin Token"
          ansible.builtin.debug:
            msg: "{{ kubernetes_dashboard_admin_token.stdout_lines }}"
          changed_when: false
          when: utilities.dashboard.type == "kubernetes-dashboard" and utilities.dashboard.createAdminToken | default(false)

        - name: "Setup Headlamp Dashboard Admin Token"
          when: utilities.dashboard.type == "headlamp" and utilities.dashboard.createAdminToken | default(false)
          ansible.builtin.shell: |
            kubectl create token --namespace {{ utilities.dashboard.namespace }} headlamp
          changed_when: false
          register: headlamp_dashboard_admin_token

        - name: "Display Headlamp Dashboard Admin Token"
          ansible.builtin.debug:
            msg: "{{ headlamp_dashboard_admin_token.stdout_lines }}"
          changed_when: false
          when: utilities.dashboard.type == "headlamp" and utilities.dashboard.createAdminToken | default(false)

        - name: "Setup Rancher Dashboard"
          when: utilities.dashboard.type == "rancher" and utilities.certmanager.enable
          ansible.builtin.shell: |
            helm repo add rancher-stable https://releases.rancher.com/server-charts/stable
            helm repo update
            helm upgrade --install rancher rancher-stable/rancher \
              --namespace cattle-system --create-namespace --version 2.13.1 --wait \
              --set hostname={{ utilities.dashboard.host }} \
              --set ingress.ingressClassName={{ utilities.dashboard.ingressClass }} \
              --set replicas=1
          changed_when: false
          register: rancher_dashboard_result

        - name: "Display Rancher Dashboard result"
          ansible.builtin.debug:
            msg: "{{ rancher_dashboard_result.stdout_lines }}"
          changed_when: false
          when: utilities.dashboard.type == "rancher" and utilities.certmanager.enable

    - name: "Setup Storage for the cluster"
      tags: storage
      when: utilities.storage.enable | default(false)
      block:
        - name: "Copy template for Longhorn Storage iSCSI setup to remote host"
          when: utilities.storage.type == "longhorn" and utilities.storage.longhorn.setup.iscsi | default(false)
          ansible.builtin.template:
            src: "longhorn-iscsi-installation.yaml.j2"
            dest: "/home/{{ user }}/longhorn-iscsi-installation.yaml"
            mode: "0644"
          changed_when: false
       
        - name: "Copy template for Longhorn Storage NFS setup to remote host"
          when: utilities.storage.type == "longhorn" and utilities.storage.longhorn.setup.nfs | default(false)
          ansible.builtin.template:
            src: "longhorn-nfs-installation.yaml.j2"
            dest: "/home/{{ user }}/longhorn-nfs-installation.yaml"
            mode: "0644"
          changed_when: false
        
        - name: "Create Longhorn Storage with iSCSI support"
          when: utilities.storage.type == "longhorn" and utilities.storage.longhorn.setup.iscsi | default(false)
          ansible.builtin.shell: |
            cat <<EOF | kubectl apply -f -
            apiVersion: v1
            kind: Namespace
            metadata:
              name: longhorn-system
            EOF
            kubectl apply -f /home/{{ user }}/longhorn-iscsi-installation.yaml
          changed_when: false
          register: longhorn_iscsi_storage_result

        - name: "Display Longhorn Storage with iSCSI support result"
          ansible.builtin.debug:
            msg: "{{ longhorn_iscsi_storage_result.stdout_lines }}"
          changed_when: false
          when: utilities.storage.type == "longhorn" and utilities.storage.longhorn.setup.iscsi | default(false)

        - name: "Create Longhorn Storage with NFS support"
          when: utilities.storage.type == "longhorn" and utilities.storage.longhorn.setup.nfs | default(false)
          ansible.builtin.shell: |
            cat <<EOF | kubectl apply -f -
            apiVersion: v1
            kind: Namespace
            metadata:
              name: longhorn-system
            EOF
            kubectl apply -f /home/{{ user }}/longhorn-nfs-installation.yaml
          changed_when: false
          register: longhorn_nfs_storage_result

        - name: "Display Longhorn Storage with NFS support result"
          ansible.builtin.debug:
            msg: "{{ longhorn_nfs_storage_result.stdout_lines }}"
          changed_when: false
          when: utilities.storage.type == "longhorn" and utilities.storage.longhorn.setup.nfs | default(false)

        # Reference Issue: https://github.com/longhorn/longhorn/issues/12573 for memory leak, so update longhorn
        # from v1.11.0 to v1.11.1 which has the fix for this issue
        # Fixed: https://github.com/longhorn/longhorn/issues/12820#issuecomment-4095195336
        - name: "Setup Longhorn Storage for the cluster"
          when: utilities.storage.type == "longhorn"
          ansible.builtin.shell: |
            helm repo add longhorn https://charts.longhorn.io
            helm repo update
            helm upgrade --install longhorn longhorn/longhorn \
              --namespace longhorn-system --create-namespace --version 1.11.1 --wait \
              --set longhornUI.replicas=1 \
              --set persistence.defaultClassReplicaCount={{ utilities.storage.longhorn.replicaStorage | default(3) }}

          changed_when: false
          register: longhorn_storage_result

        - name: "Display Longhorn Storage result"
          ansible.builtin.debug:
            msg: "{{ longhorn_storage_result.stdout_lines }}"
          changed_when: false
          when: utilities.storage.type == "longhorn"

        # Setup `local-path-provisioner` storage, powered by Rancher
        # GitHub: https://github.com/rancher/local-path-provisioner
        - name: "Setup local-path-provisioner Storage"
          when: utilities.storage.type == "local-path"
          ansible.builtin.shell: |-
            kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.37/deploy/local-path-storage.yaml
          register: local_path_log
          changed_when: false
        
        - name: "Log the setup local-path-provisioner"
          when: utilities.storage.type == "local-path"
          ansible.builtin.debug:
            msg: "{{ local_path_log.stdout_lines }}"
          changed_when: false

        # Setup test-case for validate PVC worked or not
        - name: "Copy test-case for validate storage with Pod RWO"
          when: utilities.storage.test.enable
          ansible.builtin.template:
            src: "pod-with-pvc.yaml.j2"
            dest: "/home/{{ user }}/pod-with-pvc.yaml"
            mode: "0644"
          changed_when: false
        
        - name: "Setup test case for validate storage"
          when: utilities.storage.test.enable
          ansible.builtin.shell:
            kubectl apply -f /home/{{ user }}/pod-with-pvc.yaml
          register: setup_pvc_test
          changed_when: false

        - name: "Result of setup test-case pvc"
          when: utilities.storage.test.enable
          ansible.builtin.debug:
            msg: "{{ setup_pvc_test.stdout_lines }}"
          changed_when: false

    - name: "Setup Secret Management for the cluster"
      tags: secret_management
      when: utilities.secretManagement.enable | default(false)
      block:
        # NOTE: `server.dev.enabled=false` resets dev mode kept by `--reuse-values` when switching dev -> standalone
        - name: "Setup HashiCorp Vault Standalone Mode for Secret Management"
          when: utilities.secretManagement.type == "vault" and utilities.secretManagement.config.mode == "standalone"
          ansible.builtin.shell: |
            helm repo add hashicorp https://helm.releases.hashicorp.com
            helm repo update
            helm upgrade --install vault hashicorp/vault \
              --namespace vault --create-namespace --version 0.32.0 --wait \
              --reuse-values \
              --set injector.enabled=false \
              --set server.dev.enabled=false \
              --set server.ingress.enabled=true \
              --set server.ingress.ingressClassName={{ utilities.secretManagement.ingressClass }} \
              --set server.ingress.hosts[0].host={{ utilities.secretManagement.host }}
          changed_when: false
          register: vault_standalone_result

        - name: "Setup HashiCorp Vault Dev Mode for Secret Management"
          when: utilities.secretManagement.type == "vault" and utilities.secretManagement.config.mode == "dev"
          ansible.builtin.shell: |
            helm repo add hashicorp https://helm.releases.hashicorp.com
            helm repo update
            helm upgrade --install vault hashicorp/vault \
              --namespace vault --create-namespace --version 0.32.0 --wait \
              --reuse-values \
              --set injector.enabled=false \
              --set server.dev.enabled=true \
              --set server.ingress.enabled=true \
              --set server.ingress.ingressClassName={{ utilities.secretManagement.ingressClass }} \
              --set server.ingress.hosts[0].host={{ utilities.secretManagement.host }}
          changed_when: false
          register: vault_dev_result

        # A skipped task still overwrites its register, so each mode keeps its own result variable
        - name: "Display HashiCorp Vault Secret Management result"
          ansible.builtin.debug:
            msg: "{{ (vault_standalone_result if utilities.secretManagement.config.mode == 'standalone' else vault_dev_result).stdout_lines }}"
          changed_when: false
          when: utilities.secretManagement.type == "vault"

        - name: "Enable Vault Injector"
          when: utilities.secretManagement.type == "vault" and utilities.secretManagement.config.injector
          ansible.builtin.shell: |-
            helm upgrade --install vault hashicorp/vault \
              --namespace vault --create-namespace --version 0.32.0 --wait \
              --reuse-values \
              --set injector.enabled=true
          register: vault_injector
          changed_when: false

        - name: "Display Enable Vault Injector"
          when: utilities.secretManagement.type == "vault" and utilities.secretManagement.config.injector
          ansible.builtin.debug:
            msg: "{{ vault_injector.stdout_lines }}"
          changed_when: false

        # Determine openbao chart version based on secret management type by K8s Server Version
        # NOTE: Because version usually in float format, we need to use bash comparison with `bc`
        # Reference: https://www.baeldung.com/linux/bash-compare-float#using-the-bc-command
        - name: "Setup OpenBao Standalone Mode for Secret Management"
          when: utilities.secretManagement.type == "openbao" and utilities.secretManagement.config.mode == "standalone"
          ansible.builtin.shell: |
            helm repo add openbao https://openbao.github.io/openbao-helm
            helm repo update
            helm upgrade --install openbao openbao/openbao \
              --namespace openbao --create-namespace --version 0.30.1 --wait \
              --reuse-values \
              --set injector.enabled=false \
              --set server.dev.enabled=false \
              --set server.ingress.enabled=true \
              --set server.ingress.ingressClassName={{ utilities.secretManagement.ingressClass }} \
              --set server.ingress.hosts[0].host={{ utilities.secretManagement.host }} \
              --set ui.enabled=true
          changed_when: false
          register: openbao_standalone_result

        - name: "Setup OpenBao Dev Mode for Secret Management"
          when: utilities.secretManagement.type == "openbao" and utilities.secretManagement.config.mode == "dev"
          ansible.builtin.shell: |
            helm repo add openbao https://openbao.github.io/openbao-helm
            helm repo update
            helm upgrade --install openbao openbao/openbao \
              --namespace openbao --create-namespace --version 0.30.1 --wait \
              --reuse-values \
              --set injector.enabled=false \
              --set server.dev.enabled=true \
              --set server.ingress.enabled=true \
              --set server.ingress.ingressClassName={{ utilities.secretManagement.ingressClass }} \
              --set server.ingress.hosts[0].host={{ utilities.secretManagement.host }} \
              --set ui.enabled=true
          changed_when: false
          register: openbao_dev_result

        - name: "Display openbao Secret Management result"
          ansible.builtin.debug:
            msg: "{{ (openbao_standalone_result if utilities.secretManagement.config.mode == 'standalone' else openbao_dev_result).stdout_lines }}"
          changed_when: false
          when: utilities.secretManagement.type == "openbao"

        - name: "Enable OpenBao Vault Injector"
          when: utilities.secretManagement.type == "openbao" and utilities.secretManagement.config.injector
          ansible.builtin.shell: |-
            helm upgrade --install openbao openbao/openbao \
              --namespace openbao --create-namespace --version 0.30.1 --wait \
              --reuse-values \
              --set injector.enabled=true
          register: openbao_vault_injector
          changed_when: false

        - name: "Display Enable Vault Injector"
          when: utilities.secretManagement.type == "openbao" and utilities.secretManagement.config.injector
          ansible.builtin.debug:
            msg: "{{ openbao_vault_injector.stdout_lines }}"
          changed_when: false

        # `helm --wait` skips the server StatefulSet (updateStrategy OnDelete) and its volumeClaimTemplates PVC,
        # so wait for the server pod to be Running (PVC bound) before initialize / unseal
        - name: "Wait for Vault or Openbao server pod to be Running"
          when: utilities.secretManagement.config.mode == "standalone"
          ansible.builtin.shell: |
            NAMESPACE="{{ utilities.secretManagement.type }}"
            POD_NAME="{{ utilities.secretManagement.type }}-0"
            for i in $(seq 1 60); do
              kubectl -n $NAMESPACE get pod $POD_NAME >/dev/null 2>&1 && break
              sleep 5
            done
            kubectl -n $NAMESPACE wait --for=jsonpath='{.status.phase}'=Running pod/$POD_NAME --timeout=300s
          changed_when: false

        - name: "Initialize Vault or Openbao Secret Management"
          when: utilities.secretManagement.config.mode == "standalone"
          ansible.builtin.shell: |
            # Choose the vault platfrom to initialize, Vault or Openbao (OpenBao image ships the `bao` CLI)
            if [ "{{ utilities.secretManagement.type }}" = "vault" ]; then
              POD_NAME="vault-0"
              NAMESPACE="vault"
              CLI="vault"
            elif [ "{{ utilities.secretManagement.type }}" = "openbao" ]; then
              POD_NAME="openbao-0"
              NAMESPACE="openbao"
              CLI="bao"
            else
              echo "Unsupported secret management type for initialization."
              exit 1
            fi
            # Prevent re-initialization error by checking if vault is already initialized
            INIT_STATUS=$(kubectl -n $NAMESPACE exec $POD_NAME -- $CLI status | grep 'Initialized' | awk '{print $2}')
            if [ "$INIT_STATUS" = "true" ]; then
              echo "{{ utilities.secretManagement.type }} is already initialized, skipping initialization."
              exit 0
            else
              kubectl -n $NAMESPACE exec $POD_NAME -- $CLI operator init -key-shares=1 -key-threshold=1 -format=json > /home/{{ user }}/vault-init-output.json
              echo "{{ utilities.secretManagement.type }} initialized successfully. Initialization output saved to /home/{{ user }}/vault-init-output.json"
              exit 0
            fi
          changed_when: false
          register: vault_initialize_result

        - name: "Display Vault or Openbao Initialize result"
          ansible.builtin.debug:
            msg: "{{ vault_initialize_result.stdout_lines }}"
          changed_when: false
          when: utilities.secretManagement.config.mode == "standalone"

        - name: "Unseal Vault or Openbao automatically"
          when: utilities.secretManagement.config.mode == "standalone"
          ansible.builtin.shell: |
            # Choose the vault platfrom to initialize, Vault or Openbao
            if [ "{{ utilities.secretManagement.type }}" = "vault" ]; then
              POD_NAME="vault-0"
              NAMESPACE="vault"
              CLI="vault"
            elif [ "{{ utilities.secretManagement.type }}" = "openbao" ]; then
              POD_NAME="openbao-0"
              NAMESPACE="openbao"
              CLI="bao"
            else
              echo "Unsupported secret management type for unseal."
              exit 1
            fi
            SEAL_STATUS=$(kubectl -n $NAMESPACE exec $POD_NAME -- $CLI status | grep 'Sealed' | awk '{print $2}')
            if [ "$SEAL_STATUS" = "true" ]; then
              VAULT_UNSEAL_KEY=$(jq -r '.unseal_keys_b64[0]' /home/{{ user }}/vault-init-output.json)
              kubectl -n $NAMESPACE exec $POD_NAME -- $CLI operator unseal $VAULT_UNSEAL_KEY
              echo "{{ utilities.secretManagement.type }} unseal successfully"
              exit 0
            else
              echo "{{ utilities.secretManagement.type }} already unseal, skipping unseal."
              exit 0
            fi
          changed_when: false
          register: vault_unseal_result

        - name: "Display Vault or Openbao Unseal result"
          ansible.builtin.debug:
            msg: "{{ vault_unseal_result.stdout_lines }}"
          changed_when: false
          when: utilities.secretManagement.config.mode == "standalone"

        - name: "Save Vault or Openbao unseal keys to ansible output file"
          when: utilities.secretManagement.config.mode == "standalone"
          ansible.builtin.fetch:
            src: "/home/{{ user }}/vault-init-output.json"
            dest: "./vault-init-output.json"
            flat: yes
