    # Setup Service Mesh for the cluster
    - name: "Setup Service Mesh for the cluster"
      tags: service_mesh
      when: utilities.serviceMesh.enable | default(false)
      block:
        - name: "Install Service Mesh components with Istio"
          when: utilities.serviceMesh.type == "istio"
          ansible.builtin.shell: |
            helm repo add istio https://istio-release.storage.googleapis.com/charts
            helm repo update
            helm upgrade --install istio-base istio/base \
              --namespace istio-system --create-namespace --version 1.29.1 --wait \
              --set defaultRevision=default
            helm upgrade --install istiod istio/istiod \
              --namespace istio-system --version 1.29.1 --wait
          changed_when: false
          register: istio_service_mesh_result

        - name: "Display Istio Service Mesh result"
          ansible.builtin.debug:
            msg: "{{ istio_service_mesh_result.stdout_lines }}"
          changed_when: false
          when: utilities.serviceMesh.type == "istio"