              --namespace kube-extensions --create-namespace --version 9.1.45 --wait
          changed_when: false
          register: reflector_extension_result

        - name: "Display K8s Reflector Extension result"
          ansible.builtin.debug:
            msg: "{{ reflector_extension_result.stdout_lines }}"
          changed_when: false
          when: utilities.extensions.reflector.enable | default(false)

        - name: "Setup K8s Reloader Extension"
          when: utilities.extensions.reloader.enable | default(false)
          ansible.builtin.shell: |
            helm repo add stakater https://stakater.github.io/stakater-charts
            helm repo update
            helm upgrade --install reloader stakater/reloader \
              --namespace kube-extensions --create-namespace --version 2.2.7 --wait
          changed_when: false
          register: reloader_extension_result

        - name: "Display K8s Reloader Extension result"
          ansible.builtin.debug:
            msg: "{{ reloader_extension_result.stdout_lines }}"
          changed_when: false
          when: utilities.extensions.reloader.enable | default(false)
        
        - name: "Setup K8s External Secrets Extension"
          when: utilities.extensions.externalsecrets.enable | default(false)
          ansible.builtin.shell: |
            helm repo add external-secrets https://charts.external-secrets.io
            helm repo update
            helm upgrade --install externalsecrets external-secrets/external-secrets \
              --namespace external-secrets --create-namespace --version 1.2.1 --wait
          changed_when: false
          register: externalsecrets_extension_result

        - name: "Display K8s External Secrets Extension result"
          ansible.builtin.debug:
            msg: "{{ externalsecrets_extension_result.stdout_lines }}"
          changed_when: false
          when: utilities.extensions.externalsecrets.enable | default(false)

    - name: "Setup GitOps for the cluster"
      tags: gitops
      when: utilities.gitops.enable | default(false)
      block:
        # TLS Disable for ArgoCD API should be terminated when ingress enabled --> Use insecure mode for ArgoCD
        # Read more at: https://argo-cd.readthedocs.io/en/latest/operator-manual/ingress/#ambassador
        # But with Helm, you need to set `configs.params."server\.insecure"=true` to enable insecure mode for ArgoCD for right format of the value
        # Reference: https://github.com/argoproj/argo-cd/discussions/18277
        - name: "Setup ArgoCD for GitOps"
          when: utilities.gitops.type == "argocd"
          ansible.builtin.shell: |
            helm repo add argo https://argoproj.github.io/argo-helm
            helm repo update
            helm upgrade --install argocd argo/argo-cd \
              --namespace argocd --create-namespace --version 10.16.0 --wait \
              --set global.domain={{ utilities.gitops.argocd.host }} \
              --set server.ingress.enabled=true \
              --set server.ingress.ingressClassName={{ utilities.gitops.argocd.ingressClass }} \
              --set server.ingress.hostname={{ utilities.gitops.argocd.host }} \
              --set configs.params."server\.insecure"=true \
              --set dex.enabled=false

          changed_when: false
          register: argocd_gitops_result

        - name: "Display ArgoCD GitOps result"
          ansible.builtin.debug:
            msg: "{{ argocd_gitops_result.stdout_lines }}"
          changed_when: false
          when: utilities.gitops.type == "argocd"

        - name: "Setup Image Updater for ArgoCD"
          when: utilities.gitops.type == "argocd" and utilities.gitops.argocd.argocdImageUpdater | default(false)
          ansible.builtin.shell: |
            helm repo add argo https://argoproj.github.io/argo-helm
            helm repo update
            helm upgrade --install argocd-image-updater argo/argocd-image-updater \
              --namespace argocd --version 1.5.0 --wait
          changed_when: false
          register: argocd_image_updater_result

        - name: "Display ArgoCD Image Updater result"
          ansible.builtin.debug:
            msg: "{{ argocd_image_updater_result.stdout_lines }}"
          changed_when: false
          when: utilities.gitops.type == "argocd" and utilities.gitops.argocd.argocdImageUpdater | default(false)

        - name: "Setup ArgoCD Extensions for ArgoCD"
          when: utilities.gitops.type == "argocd" and utilities.gitops.argocd.argocdExtensions | default(false)
          ansible.builtin.shell: |
            helm upgrade --install argocd argo/argo-cd \
              --namespace argocd --version 10.16.0 --wait \
              --reuse-values \
              --set server.extensions.enabled=true \
              --set server.extensions.extensionList[0].name="argocd-extension-metrics" \
              --set server.extensions.extensionList[0].env[0].name=EXTENSION_URL \
              --set server.extensions.extensionList[0].env[0].value="https://github.com/argoproj-labs/argocd-extension-metrics/releases/download/v1.0.3/extension.tar.gz" \
              --set server.extensions.extensionList[0].env[1].name=EXTENSION_VERSION \
              --set server.extensions.extensionList[0].env[1].value="v1.0.3" \
              --set server.extensions.extensionList[1].name="rollout-extension" \
              --set server.extensions.extensionList[1].env[0].name=EXTENSION_URL \
              --set server.extensions.extensionList[1].env[0].value="https://github.com/argoproj-labs/rollout-extension/releases/download/v0.3.7/extension.tar" \
              --set server.extensions.extensionList[1].env[1].name=EXTENSION_VERSION \
              --set server.extensions.extensionList[1].env[1].value="v0.3.7"
            
          changed_when: false
          register: argocd_extensions_result

        - name: "Display ArgoCD Extensions result"
          ansible.builtin.debug:
            msg: "{{ argocd_extensions_result.stdout_lines }}"
          changed_when: false
          when: utilities.gitops.type == "argocd" and utilities.gitops.argocd.argocdExtensions | default(false)

        - name: "Setup Flux for GitOps"
          when: utilities.gitops.type == "flux"
          ansible.builtin.shell: |
            curl -s https://fluxcd.io/install.sh | sudo bash
            kubectl apply -f https://github.com/fluxcd/flux2/releases/download/v2.7.5/install.yaml
          changed_when: false
          register: flux_gitops_result

        - name: "Display Flux GitOps result"
          ansible.builtin.debug:
            msg: "{{ flux_gitops_result.stdout_lines }}"
          changed_when: false
          when: utilities.gitops.type == "flux"

        # Reference: https://docs.gitops.weaveworks.org/docs/intro-weave-gitops/
        - name: "Setup Weave GitOps UI for Flux"
          when: utilities.gitops.type == "flux" and utilities.gitops.flux.ui | default(false)
          ansible.builtin.shell: |
            # Install gitops command
            curl --silent --location "https://github.com/weaveworks/weave-gitops/releases/download/v0.38.0/gitops-$(uname)-$(uname -m).tar.gz" | tar xz -C /tmp
            sudo mv /tmp/gitops /usr/local/bin
            gitops version

            # Install Weave GitOps UI
            helm upgrade --install weave-gitops oci://ghcr.io/weaveworks/charts/weave-gitops:4.0.36 \
              --namespace flux-system --create-namespace --wait \
              --set adminUser.create=true \
              --set adminUser.username="kubewekend" \
              --set adminUser.passwordHash="$(echo -n kubewekend | gitops get bcrypt-hash)" \
              --set ingress.enabled=true \
              --set ingress.className={{ utilities.gitops.flux.ingressClass }} \
              --set ingress.hosts[0].host={{ utilities.gitops.flux.host }} \
              --set ingress.hosts[0].paths[0].path=/ \
              --set ingress.hosts[0].paths[0].pathType="ImplementationSpecific"
          changed_when: false
          register: weave_gitops_ui_result

        - name: "Display Weave GitOps UI result"
          ansible.builtin.debug:
            msg: "{{ weave_gitops_ui_result.stdout_lines }}"
          changed_when: false
          when: utilities.gitops.type == "flux" and utilities.gitops.flux.ui | default(false)

        # Reference: https://docs.kargo.io/operator-guide/basic-installation/
        - name: "Setup Kargo for GitOps"
          when: utilities.gitops.kargo.enable | default(false)
          ansible.builtin.shell: |
            # Generate hash password and sign key for kargo
            pass=$(openssl rand -base64 48 | tr -d "=+/" | head -c 32)
            echo "Password: $pass"
            hashed_pass=$(htpasswd -bnBC 10 "" $pass | tr -d ':\n')
            signing_key=$(openssl rand -base64 48 | tr -d "=+/" | head -c 32)

            # Install Kargo
            helm upgrade --install kargo oci://ghcr.io/akuity/kargo-charts/kargo --version 1.8.6 --wait \
              --namespace kargo --create-namespace \
              --set api.adminAccount.passwordHash="$hashed_pass" \
              --set api.adminAccount.tokenSigningKey="$signing_key" \
              --set api.host={{ utilities.gitops.kargo.host }} \
              --set api.ingress.enabled=true \
              --set api.ingress.ingressClassName={{ utilities.gitops.kargo.ingressClass }} \
              --set api.ingress.tls.enabled=false \
              --set api.ingress.tls.selfSignedCert=false \
              --set api.tls.enabled=false \
              --set api.tls.selfSignedCert=false \
              --set externalWebhooksServer.tls.enabled=false \
              --set externalWebhooksServer.tls.selfSignedCert=false

          changed_when: false
          register: kargo_gitops_result

        - name: "Display Kargo GitOps result"
          ansible.builtin.debug:
            msg: "{{ kargo_gitops_result.stdout_lines }}"
          changed_when: false
          when: utilities.gitops.kargo.enable | default(false)

    # Security features for the cluster
    - name: "Setup security features for the cluster"
      tags: security
      when: utilities.security.enable | default(false)
      block:
        # Setup Policy Engine for the cluster with OPA Gatekeeper (https://open-policy-agent.github.io/gatekeeper/website/docs/)
        # Reference: https://open-policy-agent.github.io/gatekeeper/website/docs/install
        - name: "Setup Policy Engine with OPA Gatekeeper for the cluster"
          when: utilities.security.policy.enable | default(false) and utilities.security.policy.type == "opa-gatekeeper"
          ansible.builtin.shell: |
            helm repo add gatekeeper https://open-policy-agent.github.io/gatekeeper/charts
            helm repo update
            helm upgrade --install gatekeeper gatekeeper/gatekeeper \
              --namespace gatekeeper-system --create-namespace --version 3.22.0 --wait \
              --set replicas=1
          changed_when: false
          register: opa_gatekeeper_policy_engine_result

        - name: "Display Policy Engine with OPA Gatekeeper result"
          ansible.builtin.debug:
            msg: "{{ opa_gatekeeper_policy_engine_result.stdout_lines }}"
          changed_when: false
          when: utilities.security.policy.enable | default(false) and utilities.security.policy.type == "opa-gatekeeper"

        # Setup Policy Engine for the cluster with Kyverno (https://kyverno.io/docs/introduction/)
        # Reference: https://kyverno.io/docs/installation/installation/
        - name: "Setup Policy Engine with Kyverno for the cluster"
          when: utilities.security.policy.enable | default(false) and utilities.security.policy.type == "kyverno"
          ansible.builtin.shell: |
            helm repo add kyverno https://kyverno.github.io/kyverno/
            helm repo update
            helm upgrade --install kyverno kyverno/kyverno \
              --namespace kyverno --create-namespace --version 3.7.1 --wait
          changed_when: false
          register: kyverno_policy_engine_result

        - name: "Display Policy Engine with Kyverno result"
          ansible.builtin.debug:
            msg: "{{ kyverno_policy_engine_result.stdout_lines }}"
          changed_when: false
          when: utilities.security.policy.enable | default(false) and utilities.security.policy.type == "kyverno"

        # Setup Identity and Access Management for the cluster with Dex (https://dexidp.io/)"
        - name: "Setup Identity and Access Management with Dex for the cluster"
          when: utilities.security.identity.enable | default(false) and utilities.security.identity.type == "dex"
          ansible.builtin.shell: |
            helm repo add dex https://charts.dexidp.io
            helm repo update
            helm upgrade --install dex dex/dex \
              --namespace dex --create-namespace --version 0.24.0 --wait \
              --set config.issuer="https://{{ utilities.security.identity.host }}" \
              --set config.storage.type="kubernetes" \
              --set config.storage.config.inCluster=true \
              --set config.enablePasswordDB=true \
              --set ingress.enabled=true \
              --set ingress.ingressClassName={{ utilities.security.identity.ingressClass }} \
              --set ingress.hosts[0].host={{ utilities.security.identity.host }} \
              --set ingress.hosts[0].paths[0].path=/ \
              --set ingress.hosts[0].paths[0].pathType="ImplementationSpecific" \
          changed_when: false
          register: dex_identity_result

        - name: "Display Identity and Access Management with Dex result"
          ansible.builtin.debug:
            msg: "{{ dex_identity_result.stdout_lines }}"
          changed_when: false
          when: utilities.security.identity.enable | default(false) and utilities.security.identity.type == "dex"

    # Setup Monitoring for the cluster
    - name: "Setup Monitoring for the cluster"
      tags: monitoring
      when: utilities.monitoring.enable | default(false)
      block:
        # Copy template for values.yaml to remote host
        - name: "Copy template for Prometheus Stack values.yaml to remote host"
          when: utilities.monitoring.type == "kube-prometheus-stack"
          ansible.builtin.template:
            src: "kube-prometheus-stack-values.yaml.j2"
            dest: "/home/{{ user }}/kube-prometheus-stack-values.yaml"
            mode: "0644"
          changed_when: false
          register: kube_prometheus_stack_values_result

        - name: "Setup Prometheus Stack for the cluster"
          when: utilities.monitoring.type == "kube-prometheus-stack"
          ansible.builtin.shell: |
            helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
            helm repo update
            helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
              --namespace {{ utilities.monitoring.namespace }} --create-namespace --version 82.16.0 --wait \
              -f /home/{{ user }}/kube-prometheus-stack-values.yaml
          changed_when: false
          register: kube_prometheus_stack_result

        - name: "Display Prometheus Stack result"
          ansible.builtin.debug:
            msg: "{{ kube_prometheus_stack_result.stdout_lines }}"
          changed_when: false
          when: utilities.monitoring.type == "kube-prometheus-stack"

        - name: "Setup Grafana Operator for the cluster"
          when: utilities.monitoring.config.grafana.operator | default(false)
          ansible.builtin.shell: |
            helm repo add grafana https://grafana.github.io/helm-charts
            helm repo update
            helm upgrade --install grafana-operator grafana/grafana-operator \
              --namespace {{ utilities.monitoring.namespace }} --create-namespace --version 5.22.2 --wait
          changed_when: false
          register: grafana_operator_result

        - name: "Display Grafana Operator result"
          ansible.builtin.debug:
            msg: "{{ grafana_operator_result.stdout_lines }}"
          changed_when: false
          when: utilities.monitoring.config.grafana.operator | default(false)

        - name: "Copy template for Alloy APM values.yaml to remote host"
          when: utilities.monitoring.apm.enable | default(false)
          ansible.builtin.template:
            src: "alloy-values.yaml.j2"
            dest: "/home/{{ user }}/alloy-values.yaml"
            mode: "0644"
          changed_when: false
          register: alloy_apm_values_result

        - name: "Setup APM with Alloy for the cluster"
          when: utilities.monitoring.apm.enable | default(false)
          ansible.builtin.shell: |
            helm repo add grafana https://grafana.github.io/helm-charts
            helm repo update
            helm upgrade --install alloy grafana/alloy \
              --namespace {{ utilities.monitoring.apm.namespace }} --create-namespace --version 1.7.0 --wait \
              -f /home/{{ user }}/alloy-values.yaml
          changed_when: false
          register: alloy_apm_result

        - name: "Display APM with Alloy result"
          ansible.builtin.debug:
            msg: "{{ alloy_apm_result.stdout_lines }}"
          changed_when: false
          when: utilities.monitoring.apm.enable | default(false)

        - name: "Copy template for Loki values.yaml to remote host"
          when: utilities.monitoring.logging.enable | default(false)
          ansible.builtin.template:
            src: "loki-values.yaml.j2"
            dest: "/home/{{ user }}/loki-values.yaml"
            mode: "0644"
          changed_when: false
          register: loki_log_management_values_result

        - name: "Setup Log Management with Loki for the cluster"
          when: utilities.monitoring.logging.enable | default(false)
          ansible.builtin.shell: |
            helm repo add grafana-community https://grafana-community.github.io/helm-charts
            helm repo update
            helm upgrade --install loki grafana-community/loki \
              --namespace {{ utilities.monitoring.logging.namespace }} --create-namespace --version 9.5.1 --wait \
              -f /home/{{ user }}/loki-values.yaml
          changed_when: false
          register: loki_log_management_result

        - name: "Display Log Management with Loki result"
          ansible.builtin.debug:
            msg: "{{ loki_log_management_result.stdout_lines }}"
          changed_when: false
          when: utilities.monitoring.logging.enable | default(false)

        - name: "Copy template for Tempo values.yaml to remote host"
          when: utilities.monitoring.tracing.enable | default(false)
          ansible.builtin.template:
            src: "tempo-values.yaml.j2"
            dest: "/home/{{ user }}/tempo-values.yaml"
            mode: "0644"
          changed_when: false
          register: tempo_tracing_values_result

        - name: "Setup Tracing with Tempo for the cluster"
          when: utilities.monitoring.tracing.enable | default(false)
          ansible.builtin.shell: |
