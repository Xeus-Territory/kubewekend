# An L7 rule: add a request header on the way to httpbin. Attached to the Service (mesh routing with the Gateway API,
# "GAMMA"), so it is applied by whichever waypoint serves httpbin. Without a waypoint nothing can apply it:
# ztunnel only handles L4.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin-add-header
  namespace: lab-ambient
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: httpbin
      port: 8080
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: x-added-by
                value: waypoint
      backendRefs:
        - name: httpbin
          port: 8080
