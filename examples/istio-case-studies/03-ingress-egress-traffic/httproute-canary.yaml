# Weighted canary: 90% of requests to v1, 10% to v2. The two versions are two Services (one per `common` chart
# release), so the split is a list of backendRefs with weights.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: helloworld
  namespace: lab-traffic
spec:
  parentRefs:
    - name: lab-gateway
  hostnames: ["hello.lab.test"]
  rules:
    - backendRefs:
        - name: helloworld-v1
          port: 5000
          weight: 90
        - name: helloworld-v2
          port: 5000
          weight: 10
