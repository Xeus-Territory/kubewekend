argocd:
  enabled: true
  server:
    ingress:
      enabled: true
      ingressClassName: "traefik"
      annotations: {}
      hostname: argocd.local

  configs:
    params:
      create: true
      annotations: {}
      # TLS Disable for ArgoCD API should be terminated when ingress enabled --> Use insecure mode for ArgoCD
      # Read more at: https://argo-cd.readthedocs.io/en/latest/operator-manual/ingress/#ambassador
      server.insecure: true

  dex:
    enabled: false

apps:
  enabled: true
  applications:
    # The app of apps pattern is used to deploy ArgoCD itself and the platform apps.
    apps:
      namespace: argocd
      additionalLabels: {}
      additionalAnnotations: {}
      finalizers:
      - resources-finalizer.argocd.argoproj.io
      project: infrastructure
      # ArgoCD v2.6 or later
      sources:
      - repoURL: "https://github.com/Xeus-Territory/kubewekend.git"
        targetRevision: HEAD
        path: "examples/argocd-apps/app-of-apps/apps"
        directory:
          recurse: true
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: false
          selfHeal: false
        syncOptions:
        - CreateNamespace=true
      revisionHistoryLimit: null
    platform:
      namespace: argocd
      additionalLabels: {}
      additionalAnnotations: {}
      finalizers:
      - resources-finalizer.argocd.argoproj.io
      project: infrastructure
      # ArgoCD v2.6 or later
      sources:
      - repoURL: "https://github.com/Xeus-Territory/kubewekend.git"
        targetRevision: HEAD
        path: "examples/argocd-apps/app-of-apps/platform"
        directory:
          recurse: true
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
      revisionHistoryLimit: null
    infrastructure:
      namespace: argocd
      additionalLabels: {}
      additionalAnnotations: {}
      finalizers:
      - resources-finalizer.argocd.argoproj.io
      project: infrastructure
      # ArgoCD v2.6 or later
      sources:
      - repoURL: "https://github.com/Xeus-Territory/kubewekend.git"
        targetRevision: HEAD
        path: "examples/argocd-apps/app-of-apps/infrastructure"
        directory:
          recurse: true
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
      revisionHistoryLimit: null

  # Reference: https://argo-cd.readthedocs.io/en/stable/user-guide/projects/
  # Examples: https://argo-cd.readthedocs.io/en/latest/operator-manual/project-specification/
  projects:
    infrastructure:
      description: "Infrastructure layer - manages ArgoCD itself and platform apps via GitOps IDP"
      sourceRepos:
        - '*'
      sourceNamespaces:
        - argocd
        - '*'
      destinations:
        # Full access to all namespaces and clusters for system bootstrapping
        - server: '*'
          namespace: '*'
      # Unrestricted cluster-wide resources - infrastructure can provision anything
      clusterResourceWhitelist:
        - group: '*'
          kind: '*'
      roles:
        - name: infra-admin
          description: "Infrastructure admin - full provisioning access to all cluster resources"
          policies:
            - p, proj:infrastructure:infra-admin, applications, *, infrastructure/*, allow
            - p, proj:infrastructure:infra-admin, exec, create, infrastructure/*, allow
        - name: viewer
          description: "Read-only access to the infrastructure project"
          policies:
            - p, proj:infrastructure:viewer, applications, get, infrastructure/*, allow
      orphanedResources:
        warn: false

image-updater:
  enabled: true