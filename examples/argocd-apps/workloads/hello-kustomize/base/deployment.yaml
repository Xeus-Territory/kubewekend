apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-kustomize
  labels:
    app.kubernetes.io/name: hello-kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-kustomize
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-kustomize
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: app
          # No tag here: each overlay sets it in `images:` (the field Image Updater rewrites in lab 3)
          image: xeusnguyen/kubewekend-todo
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /version
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /version
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          # The app writes its SQLite file to /data (an emptyDir: data lives as long as the Pod)
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
