apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hello-prod
resources:
  - ../../base
# prod is not tracked by Image Updater in lab 3: its tag changes only through a reviewed commit
images:
  - name: xeusnguyen/kubewekend-todo
    newTag: v1.0.0
patches:
  - target:
      kind: Ingress
      name: hello-kustomize
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: hello-prod.kubewekend.local
  - target:
      kind: Deployment
      name: hello-kustomize
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
