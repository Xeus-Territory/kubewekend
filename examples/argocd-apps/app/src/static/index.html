
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, maximum-scale=1.0, user-scalable=0" />
    <link rel="stylesheet" href="css/bootstrap.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="css/font-awesome/all.min.css" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css?family=Lato&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <title>Todo App</title>
</head>
<body>
    <div id="build-banner" class="text-center py-2" style="background:#eef3ff;border-bottom:1px solid #c9d6f5;font-size:.9rem">
        Loading build info…
    </div>
    <div id="root"></div>
    <script>
        // Shows the running build (set at image build time), so a GitOps rollout is visible on the page.
        fetch('/version')
            .then(function (r) { return r.json(); })
            .then(function (v) {
                document.getElementById('build-banner').textContent =
                    v.message + ' · version ' + v.version + ' · pod ' + v.hostname;
            })
            .catch(function () {
                document.getElementById('build-banner').textContent = 'Build info unavailable';
            });
    </script>
    <script src="js/react.production.min.js"></script>
    <script src="js/react-dom.production.min.js"></script>
    <script src="js/react-bootstrap.js"></script>
    <script src="js/babel.min.js"></script>
    <script type="text/babel" src="js/app.js"></script>
</body>
</html>
