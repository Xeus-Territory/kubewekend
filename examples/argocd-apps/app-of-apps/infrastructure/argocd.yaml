apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    # Wave 0: after the projects (-1), before platform (1) and apps (2)
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Argo CD manages its own installation (and Image Updater) from Git.
  project: infrastructure
  source:
    repoURL: "https://github.com/Xeus-Territory/kubewekend"
    targetRevision: HEAD
    path: "examples/argocd-apps/manifests/infrastructure/argocd"
    helm:
      # https://argo-cd.readthedocs.io/en/stable/user-guide/helm/#helm-release-name
      releaseName: argocd
      # https://argo-cd.readthedocs.io/en/stable/user-guide/helm/#values-files
      valueFiles:
        - values.yaml
      # https://argo-cd.readthedocs.io/en/stable/user-guide/helm/#helm-version
      version: v3
  destination:
    server: "https://kubernetes.default.svc"
    namespace: "argocd"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
