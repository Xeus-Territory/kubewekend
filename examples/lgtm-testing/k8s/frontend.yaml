---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: lgtm-testing
  labels:
    app.kubernetes.io/name: lgtm-testing-frontend
    app.kubernetes.io/part-of: lgtm-testing
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lgtm-testing-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lgtm-testing-frontend
        app.kubernetes.io/part-of: lgtm-testing
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: xeusnguyen/lgtm-testing-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: lgtm-testing
  labels:
    app.kubernetes.io/name: lgtm-testing-frontend
spec:
  selector:
    app.kubernetes.io/name: lgtm-testing-frontend
  ports:
    - port: 80
      targetPort: 80
      name: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lgtm-testing-ingress
  namespace: lgtm-testing
spec:
  ingressClassName: traefik
  rules:
    - host: lgtm-testing.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
